        <button class="btn sm navy">Guardar</button></form>
      <div class="box" style="margin-top:12px"><b>Másters</b><p class="hint" style="margin-top:6px">${sv.phase === 'regular'
        ? 'Al generar los cuadros se cierra la fase regular: ya no se podrán crear retos ni poner resultados normales. Hazlo cuando termine el último día.'
        : 'Los cuadros están generados. Si te has equivocado, puedes borrarlos (se pierden sus resultados) y volver a la fase regular.'}</p>
        <div class="btns">${sv.phase === 'regular' ? '<button class="btn sm" id="gen">Generar cuadros</button>' : '<a class="btn sm navy" href="#/masters">Ver cuadros</a><button class="btn sm ghost" id="mreset">Borrar cuadros</button>'}
          ${sv.phase !== 'closed' && sv.phase !== 'regular' ? '<button class="btn sm ghost" id="close">Cerrar temporada</button>' : ''}</div></div>
      <div class="box" style="margin-top:12px"><b>Exportar (copia de seguridad)</b><div class="btns"><button class="btn sm ghost" data-exp="players">Jugadores (CSV)</button><button class="btn sm ghost" data-exp="matches">Partidos (CSV)</button></div></div>`;
  } else {
    body = `<form class="box" id="pf"><label class="field">Aviso para el tablón<textarea class="input" name="body" rows="4" maxlength="1000" placeholder="Por ejemplo: quedan 10 días de fase regular…"></textarea></label>
      <button class="btn sm navy" style="margin-top:10px">Publicar</button></form>
      <p class="hint" style="margin:10px 4px">Para borrar comentarios o publicaciones, ve al Tablón: como admin verás «Borrar» en todas.</p>`;
  }
  render(`<main class="screen">
    <div class="top">${backBtn('perfil')}<div class="title">Panel del club</div><div style="width:44px"></div></div>
    <div style="margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px" id="atabs">${tabs.map(([k, l]) => `<button class="chip" style="min-width:0;padding:0 4px;height:42px;font-size:13.5px" data-tab="${k}" aria-pressed="${adminTab === k}">${l}${k === 'partidos' && disputed ? ` (${disputed})` : ''}</button>`).join('')}</div>
    <div style="margin-top:10px" id="ab">${body}</div>
  </main>${nav('perfil')}`);
  const root = document.getElementById('ab');
  document.getElementById('atabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { adminTab = b.dataset.tab; paintAdmin(); } });
  root.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.mact) {
        const id = b.dataset.id, action = b.dataset.mact;
        if (action === 'annul' && !(await confirmBox('¿Anular el partido?', 'Deja de contar para el nivel y los puntos. Todo se recalcula.', 'Anular', true))) return;
        const sets = [0, 1, 2].map((s) => [0, 1].map((i) => root.querySelector(`[data-m="${id}"][data-s="${s}"][data-i="${i}"]`)?.value.trim() ?? ''))
          .filter((x) => x[0] !== '' || x[1] !== '').map((x) => x.map(Number));
        await busy(b, () => api('POST', `admin/match/${id}`, { action, sets }));
        toast('Hecho. Todo recalculado.', true); return screenAdmin();
      }
      if (b.dataset.psave) {
        const box = root.querySelector(`[data-p="${b.dataset.psave}"]`);
        const body = { full_name: box.querySelector('[data-f="full_name"]').value, active: box.querySelector('[data-f="active"]').checked,
          muted: box.querySelector('[data-f="muted"]').checked, is_admin: box.querySelector('[data-f="is_admin"]').checked,
          attrs: Object.fromEntries(ATTRS.map(([k]) => [k, Number(box.querySelector(`[data-a="${k}"]`).value)])) };
        const pin = box.querySelector('[data-f="pin"]').value.trim(); if (pin) body.pin = pin;
        await busy(b, () => api('POST', `admin/player/${b.dataset.psave}`, body));
        toast('Guardado.', true); return screenAdmin();
      }
      if (b.dataset.pdel) {
        if (!(await confirmBox('¿Borrar a este jugador?', 'Se borran sus datos personales y sale del ranking. Sus partidos siguen contando, como «Jugador eliminado». No se puede deshacer. Si solo quieres apartarlo, desmarca «Activo».', 'Borrar', true))) return;
        await api('POST', `admin/player/${b.dataset.pdel}/delete`); toast('Jugador borrado.'); return screenAdmin();
      }
      if (b.id === 'gen') {
        if (!(await confirmBox('¿Generar los cuadros de los Másters?', 'Se cierra la fase regular con la clasificación actual y se avisa por email a los clasificados.', 'Generar'))) return;
        const r = await busy(b, () => api('POST', 'admin/masters/generate', { confirm: true }));
        toast('Cuadros generados.', true); go('masters'); return r;
      }
      if (b.id === 'mreset') {
        if (!(await confirmBox('¿Borrar los cuadros?', 'Se borran los cuadros y sus resultados, y se vuelve a la fase regular.', 'Borrar cuadros', true))) return;
        await api('POST', 'admin/masters/reset', { confirm: true }); toast('Cuadros borrados.'); return screenAdmin();
      }
      if (b.id === 'close') {
        if (!(await confirmBox('¿Cerrar la temporada?', 'Ya no se podrá jugar nada más en esta temporada.', 'Cerrar', true))) return;
        await api('POST', 'admin/season', { phase: 'closed' }); toast('Temporada cerrada.'); return screenAdmin();
      }
      if (b.dataset.exp) {
        const r = await fetch('/api/admin/export?what=' + b.dataset.exp, { headers: { Authorization: 'Bearer ' + S.token } });
        if (!r.ok) throw new Error('No se ha podido exportar.');
        const blob = await r.blob(); const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `ranking-atc-${b.dataset.exp}-${today()}.csv`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
    } catch (err) { toast(err.message); }
  });
  root.addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    try {
      if (f.id === 'sf') {
        await busy(f.querySelector('button'), () => api('POST', 'admin/season', { name: f.name.value, starts_on: f.starts_on.value, ends_on: f.ends_on.value, masters_end: f.masters_end.value, min_matches: Number(f.min_matches.value) }));
        toast('Temporada guardada.', true); screenAdmin();
      } else if (f.id === 'pf') {
        await busy(f.querySelector('button'), () => api('POST', 'admin/post', { body: f.body.value }));
        toast('Aviso publicado en el tablón.', true); f.reset();
      }
    } catch (err) { toast(err.message); }
  });
}

/* ════════════════════════════════════════════════════════════════════
   Router
   ════════════════════════════════════════════════════════════════════ */
function go(path) { const h = '#/' + path; if (location.hash === h) route(); else location.hash = h; }
const PUBLIC = new Set(['login', 'registro', 'registro/carta', 'olvide', 'reset', 'privacidad']);
async function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const q = new URLSearchParams(qs || '');
  const parts = path.split('/');
  if (!S.token && !PUBLIC.has(path)) {
    if (path) sessionStorage.setItem('atc_next', raw);
    return screenLogin();
  }
  if (S.token && !S.me) {
    try { await refreshMe(); } catch (e) { if (!S.token) return; return errorScreen(e); }
  }
  if (S.token && ['login', 'registro', 'registro/carta', 'olvide'].includes(path)) return go('');
  switch (parts[0]) {
    case '': case 'ranking': return screenRanking();
    case 'login': return screenLogin();
    case 'registro': return parts[1] === 'carta' ? screenSignup2() : screenSignup1();
    case 'olvide': return screenForgot();
    case 'reset': return screenReset(q);
    case 'privacidad': return screenPrivacy();
    case 'jugador': return screenPlayer(parts[1]);
    case 'perfil': return screenPlayer(null);
    case 'retar': return screenChallenge(parts[1]);
    case 'retos': return screenRetos();
    case 'reto': return screenCounter(parts[1]);
    case 'resultado': return screenResult('c', parts[1]);
    case 'master': return screenResult('m', parts[1]);
    case 'tablon': return screenFeed();
    case 'masters': return screenMasters();
    case 'ajustes': return screenSettings();
    case 'admin': return screenAdmin();
    default: return go('');
  }
}
window.addEventListener('hashchange', route);
// tocar la pestaña en la que ya estás la recarga
document.addEventListener('click', (e) => { const l = e.target.closest('a[href^="#/"]'); if (l && l.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
route();
</script>
</body>
</html>
