<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12294A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranking ATC">
<meta name="robots" content="noindex, nofollow">
<title>Ranking ATC · Almuñécar Tennis Club</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/img/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF8;--card:#FFFFFF;--ink:#0F1720;--muted:#546073;--line:#E0E2E8;--soft:#EEF0F4;
  --navy:#12294A;--navy-2:#0B1B33;--navy-3:#1A3760;--orange:#E35B2A;--orange-hover:#CC5224;--orange-soft:#FCEDE6;--peach:#F7A27E;
  --ok:#1F9D6B;--ok-soft:#E8F6F0;--bad:#B8431A;--gold:#F4E2A1;
  --font:'Figtree',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);--ease-ios:cubic-bezier(.32,.72,0,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  /* Liquid glass */
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.78);--glass-line:rgba(255,255,255,.75);
  --glass-blur:blur(22px) saturate(180%);
  --glass-shadow:0 10px 30px rgba(15,23,32,.12),0 1px 2px rgba(15,23,32,.06),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25);
  --card:rgba(255,255,255,.82);--card-line:rgba(255,255,255,.9);--card-shadow:0 1px 2px rgba(15,23,32,.05),0 6px 18px rgba(15,23,32,.05);
}
#shell{
  background:radial-gradient(80% 40% at 100% 0%,rgba(227,91,42,.06),transparent 70%),#F4F3F0}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#F3F1ED}
/* La app vive en una «carcasa» del tamaño exacto de la parte visible de la pantalla (visualViewport).
   Dentro se desplaza el contenido; el menú va anclado a la carcasa, no a la página. */
#shell{position:fixed;left:0;right:0;top:0;height:100%;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#shell.kb .nav{display:none}
body{min-height:100vh;min-height:100dvh;background:transparent;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--orange);text-decoration:none}
img{display:block}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.screen{animation:screenIn 160ms ease-out both;padding:calc(12px + var(--sat)) 18px calc(124px + var(--sab));}
.screen.nonav{padding-bottom:calc(32px + var(--sab))}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botones */
.btn{box-shadow:0 6px 18px rgba(227,91,42,.28),inset 0 1px 0 rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 26px;border-radius:999px;border:0;font-weight:700;font-size:17px;background:var(--orange);color:#fff;text-decoration:none;transition:transform 160ms var(--ease),background-color 160ms ease}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--orange-hover)}}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.navy{background:var(--navy);box-shadow:0 6px 18px rgba(18,41,74,.25),inset 0 1px 0 rgba(255,255,255,.15)}.btn.navy:hover{background:var(--navy-3)}
.btn.ghost{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink)}.btn.ghost:hover{background:#fff}
.btn.ghost-dark{background:rgba(255,255,255,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.btn.block{width:100%}
.btn.sm{height:44px;font-size:15px;padding:0 18px}
.btn.xs{height:36px;font-size:14px;padding:0 14px}
.icon-btn{width:44px;height:44px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.link{background:none;border:0;padding:6px 0;font-weight:700;font-size:14px;color:var(--muted)}
.link.orange{color:var(--orange)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input{height:54px;border-radius:16px;border:1px solid rgba(224,226,232,.9);background:rgba(255,255,255,.85);font-size:17px;font-weight:500;padding:0 16px;color:var(--ink);width:100%;outline:none;transition:border-color 160ms,box-shadow 160ms}
.input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,41,74,.12)}
textarea.input{height:auto;padding:12px 14px;resize:none;font-size:15px;line-height:1.4}
.dark .input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
.dark .input::placeholder{color:rgba(255,255,255,.45)}
.dark .input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.dark .field{color:rgba(255,255,255,.75)}
.hint{font-size:13px;line-height:1.45;color:var(--muted);margin:0}
.err{background:#FCEDE6;color:#9B3511;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted)}
.check input{width:20px;height:20px;margin:0;accent-color:var(--navy);flex:none}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:rgba(238,240,244,.7);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.7)}
.seg button{height:38px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(18,41,74,.25)}
.dark .seg{background:rgba(255,255,255,.08)}
.dark .seg button{color:rgba(255,255,255,.8)}
.dark .seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:64px;height:48px;padding:0 14px;border-radius:16px;border:1px solid var(--card-line);background:var(--card);box-shadow:var(--card-shadow);color:var(--ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip small{font-size:11px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(to right,var(--navy) var(--p),var(--line) var(--p));outline:none;margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.18)}
.slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--orange)}

/* Cabeceras */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;position:sticky;top:calc(8px + var(--sat));z-index:15}
.top .title{padding:9px 16px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.top .title{font-size:16px;font-weight:700}
h1.h{margin:16px 0 0;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--navy-3) 0%,var(--navy) 50%,var(--navy-2) 100%);color:#fff}
.rank-head{margin:calc(-12px - var(--sat)) -18px 0;padding:calc(20px + var(--sat)) 20px 18px;border-radius:0 0 30px 30px;box-shadow:0 12px 30px rgba(11,27,51,.22);text-align:center;display:flex;flex-direction:column;align-items:center}
.rank-head img{width:140px;height:auto}
.rank-head h1{margin:12px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.season-sub{margin-top:8px;font-size:12px;font-weight:600;color:var(--peach);letter-spacing:.01em}
.season-bar{width:150px;height:3px;margin:7px auto 0;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.season-bar i{display:block;height:100%;background:var(--orange);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1)}
.pill.light{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9);font-size:13px;padding:7px 12px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.14);width:100%;margin-top:14px}
.tabs button{height:38px;border-radius:999px;border:0;background:transparent;color:rgba(255,255,255,.8);font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tabs.light{background:var(--soft)}
.tabs.light button{color:var(--muted)}
.tabs.light button[aria-selected="true"]{background:var(--navy);color:#fff}

/* Listas */
.list{display:flex;flex-direction:column;gap:6px}
.zone{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px}
.zone.oro{color:#A47F2A}.zone.plata{color:#6B7482}.zone.bronce{color:#9C6537}.zone.challenger{color:var(--navy)}
.prow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px;border-radius:18px;background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);color:var(--ink);text-decoration:none}
.prow.me{background:rgba(252,237,230,.92);border:1.5px solid var(--orange)}
.prow .pos{width:24px;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.prow .who{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who span{font-size:12px;color:var(--muted);font-weight:600}
.prow .num{width:30px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .big{min-width:36px;text-align:right;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--navy);overflow:hidden;object-fit:cover}
.av.top3{background:var(--navy);color:var(--gold)}
.av.lg{width:56px;height:56px;font-size:18px}
.av.xl{width:84px;height:84px;font-size:26px}
.search{position:relative;margin-top:12px}
.search input{padding-left:42px;height:46px;font-size:15px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.06)}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted);z-index:2;pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:32px 12px;font-size:15px;line-height:1.5}

/* Tarjetas */
.box{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:22px;padding:14px 16px}
.box.navy{background:radial-gradient(120% 120% at 90% 0%,var(--navy-3),var(--navy) 55%,var(--navy-2));border-color:rgba(255,255,255,.08);color:#fff;box-shadow:0 12px 30px rgba(11,27,51,.22)}
.box + .box{margin-top:10px}
.sec{margin-top:22px}
.sec > .label{display:block;margin:0 0 8px 4px}
.kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.when{font-size:14px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;padding:10px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:700}
.tile span{font-size:12px;font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--navy)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--orange-soft);color:var(--bad)}
.wl{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:3px 6px;background:var(--ok)}
.wl.l{background:var(--bad)}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:16px;padding:10px 12px;color:var(--ink)}
.mrow .r{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .s{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;white-space:nowrap;padding:0 12px}

.pill-row .pill{font-size:12px;padding:5px 9px;white-space:nowrap}
.share-pop{display:flex;margin:10px auto 0;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;transition:transform 160ms var(--ease)}
.share-pop:active{transform:scale(.96)}
.share-pop svg{width:14px;height:14px;flex:none}
/* Carta */
.fut-wrap{display:flex;flex-direction:column;align-items:center}
.fut{position:relative;width:min(272px,78vw);aspect-ratio:3/3.85;padding:20px 24px 16px;color:var(--navy);overflow:hidden;
  clip-path:polygon(50% 0,100% 6%,100% 88%,50% 100%,0 88%,0 6%);
  background:linear-gradient(155deg,#F4E2A1 0%,#D8B65A 45%,#B8913A 100%);filter:drop-shadow(0 18px 30px rgba(15,23,32,.18));animation:cardIn 360ms var(--ease) backwards;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 520ms cubic-bezier(.22,1.2,.36,1)}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) scale(.94) rotateX(8deg)}}
.fut.tilting{transition:transform 90ms linear}
.fut::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.45),transparent 60%);opacity:var(--glare,0);transition:opacity 320ms ease;mix-blend-mode:soft-light}
.fut.silver{background:linear-gradient(155deg,#F1F3F6 0%,#C9CED6 50%,#9DA5B1 100%)}
.fut.bronze{background:linear-gradient(155deg,#F0CDA8 0%,#C98F5B 50%,#9C6537 100%)}
.fut.special{background:radial-gradient(120% 80% at 80% 0%,#1D3A66 0%,#12294A 45%,#0B1B33 100%);color:#fff}
.fut.diamond{background:linear-gradient(155deg,#FFFFFF 0%,#E4F1FA 28%,#B9D7EC 58%,#8FB8D8 82%,#6E9CC2 100%)}
.fut.diamond::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,transparent 34%,rgba(255,255,255,.72) 46%,transparent 56%),
             linear-gradient(62deg,transparent 60%,rgba(255,255,255,.45) 70%,transparent 78%)}
.fut-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.fut-lvl{display:flex;flex-direction:column;align-items:center;line-height:1}
.fut-lvl b{font-size:50px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fut.special .fut-lvl b,.fut.special .fs b{color:var(--orange)}
.fut-lvl span{font-size:11px;font-weight:700;letter-spacing:.16em;margin-top:3px}
.fut-lvl i{font-style:normal;font-size:10px;font-weight:700;margin-top:6px;padding:3px 8px;border-radius:999px;background:rgba(18,41,74,.12)}
.fut.special .fut-lvl i{background:rgba(255,255,255,.14)}
.fut-photo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.6);margin-top:2px}
.fut-logo{width:96px;height:auto;margin-top:8px;opacity:.9}
.fut-name{font-size:19px;font-weight:700;letter-spacing:.06em;text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(18,41,74,.2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut.special .fut-name{border-color:rgba(255,255,255,.2)}
.fut-tier{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.65;margin-top:2px}
.fut-age{opacity:1;font-weight:800}
.fut-stats{display:flex;flex-direction:column;gap:2px;margin:8px 6px 0}
.fs{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(18,41,74,.1);padding-bottom:1px}
.fut.special .fs{border-color:rgba(255,255,255,.08)}
.fs span{font-size:13.5px;font-weight:600;opacity:.9}
.fs b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{width:100%;height:46px}

.pagehead{padding:10px 2px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.linkbtn{background:none;border:0;padding:6px 10px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* Barra inferior */
.nav{position:absolute;z-index:30;left:0;right:0;bottom:calc(10px + var(--sab));margin:0 auto;width:calc(100% - 32px);max-width:420px;height:64px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(26,55,96,.97),rgba(14,33,61,.97));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 32px rgba(11,27,51,.35),inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-transform:translateZ(0);transform:translateZ(0)}
.nav{touch-action:none;-webkit-user-select:none;user-select:none}
.nav a,.nav-hi>span{height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative;transition:transform 160ms var(--ease)}
.nav a{color:rgba(214,226,245,.62);z-index:1;-webkit-touch-callout:none;-webkit-user-drag:none}
.nav a svg,.nav-hi svg{width:22px;height:22px;stroke-width:1.8}
.nav .press{transform:scale(.92)}
/* La pastilla y la copia blanca de los iconos se recortan con la misma forma: al deslizarse,
   el icono se vuelve blanco justo donde pasa la pastilla. */
.nav-ind,.nav-hi{position:absolute;inset:0;pointer-events:none;transition:opacity 200ms ease}
.nav-ind{z-index:0;background:rgba(255,255,255,.16)}
.nav-hi{z-index:2;padding:5px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;color:#fff}
.nav.lift .nav-ind{background:rgba(255,255,255,.24)}
.nav .dot{position:absolute;top:5px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy)}

/* Login */
.login{min-height:100vh;min-height:100dvh;padding:calc(48px + var(--sat)) 26px calc(28px + var(--sab));display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.login .ring{position:absolute;border-radius:50%;pointer-events:none}
.login h1{margin:12px 0 0;font-size:56px;line-height:.95;font-weight:700;letter-spacing:-.03em;text-align:center}
.login h1 span{color:var(--orange)}
.login form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:28px;position:relative}
.or{width:100%;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.or p{margin:0;font-size:15px;color:rgba(255,255,255,.8)}

/* Tablón (compacto, tipo Instagram) */
.post{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:20px;padding:12px 14px 8px}
.post.admin{background:radial-gradient(120% 120% at 90% 0%,var(--navy-3),var(--navy) 55%,var(--navy-2));border-color:rgba(255,255,255,.08);color:#fff;box-shadow:0 12px 30px rgba(11,27,51,.22)}
.post + .post{margin-top:8px}
.ph{display:flex;align-items:center;gap:10px}
.ph .av{width:34px;height:34px;font-size:12px}
.ph .meta{flex:1;min-width:0;line-height:1.25}
.ph .kind{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.ph .t{font-size:12px;font-weight:600;color:var(--muted)}
.post.admin .ph .t{color:rgba(255,255,255,.6)}
.post .txt{margin-top:8px;font-size:15px;font-weight:700;line-height:1.35}
.post .txt em{font-style:normal;font-weight:500;color:var(--muted)}
.post .body{margin-top:8px;font-size:15px;line-height:1.45;white-space:pre-line;font-weight:500}
.post .sub2{margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}
.score{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score b{font-size:18px;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.act{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 8px;border:0;background:none;border-radius:999px;color:var(--ink);font-size:14px;font-weight:700}
.act svg{width:22px;height:22px}
.act.liked{color:#E0245E}
.act.liked svg{fill:#E0245E;stroke:#E0245E}
.act:active svg{transform:scale(1.2)}
.post.admin .act{color:#fff}
.act.del{margin-left:auto;color:var(--muted);font-size:12px}
.post.admin .act.del{color:rgba(255,255,255,.6)}
.likers{background:none;border:0;padding:0;font-size:13.5px;font-weight:700;color:inherit}
.prev{margin-top:4px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.addc{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:4px 0;background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;text-align:left}
.addc .av{width:24px;height:24px;font-size:9.5px}
.post.admin .addc{color:rgba(255,255,255,.6)}
.prev b{margin-right:4px}
.more{background:none;border:0;padding:2px 0;font-size:13.5px;font-weight:600;color:var(--muted);display:block}
.post.admin .more{color:rgba(255,255,255,.65)}
.comments{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post.admin .comments{border-color:rgba(255,255,255,.15)}
.cmt{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.cmt .av{width:26px;height:26px;font-size:10px}
.cmt b{margin-right:4px}
.cmt .ct{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
.cmt .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:2px 0 2px 6px}
.cform{display:flex;gap:8px;margin:10px 0 4px}
.cform input{height:40px;font-size:15px;border-radius:999px}
.cform button{height:40px;flex:none}

/* Másters */
.round{margin-top:18px}
.bm{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;overflow:hidden}
.bm + .bm{margin-top:8px}
.bm .pl{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:15px;font-weight:600}
.bm .pl + .pl{border-top:1px solid var(--line)}
.bm .pl.w{font-weight:800}
.bm .pl .sd{width:22px;font-size:12px;color:var(--muted);font-weight:700}
.bm .pl .sc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.bm .pl.tbd{color:var(--muted);font-weight:500}
.champ{margin-top:14px;text-align:center;padding:18px;border-radius:18px;background:var(--navy);color:#fff}
.champ b{display:block;font-size:22px;margin-top:4px;color:var(--gold)}

/* Hojas y avisos */
.sheet-bg{position:absolute;inset:0;z-index:50;background:rgba(11,27,51,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeBg 200ms both}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{width:calc(100% - 20px);max-width:460px;margin-bottom:calc(10px + var(--sab));background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(15,23,32,.25),inset 0 1px 0 #fff;border-radius:34px;padding:24px 22px 20px;animation:sheetUp 320ms cubic-bezier(.32,.72,0,1) both;max-height:90vh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:21px;line-height:1.25}
.sheet p{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
.toast{position:absolute;left:50%;bottom:calc(96px + var(--sab));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);transform:translateX(-50%);text-align:center;background:rgba(15,23,32,.82);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(15,23,32,.25);animation:toastUp 240ms var(--ease) both}
@keyframes toastUp{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.ok{background:rgba(31,157,107,.88)}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--orange);animation:spin 600ms linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.prose h2{font-size:18px;margin:22px 0 6px}
.prose p,.prose li{font-size:15px;line-height:1.55;color:var(--ink)}
.prose h3{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.prose h3+ul{margin-top:0}
.pts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.pts3 div{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;padding:13px 6px;text-align:center}
.pts3 b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.pts3 span{display:block;margin-top:7px;font-size:12px;line-height:1.3;color:var(--muted);font-weight:600}
.how-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#fff;opacity:.88;border-bottom:1px solid rgba(255,255,255,.38);padding-bottom:1px}
.howbox{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:22px;padding:14px 16px;margin-top:10px}
.howbox h3{margin:0 0 6px;font-size:16px}
.howbox p{margin:0 0 8px}.howbox p:last-child{margin-bottom:0}
.howbox ul{margin:0;padding-left:20px}.howbox ul+p{margin-top:9px}
.ej{background:var(--soft);border-radius:14px;padding:11px 13px;margin-top:11px}
.ej .t{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.howbox .ej p{margin:0;font-size:14.5px;line-height:1.5}.howbox .ej p+p{margin-top:5px}.howbox li{margin-bottom:5px}.howbox li:last-child{margin-bottom:0}
details.adm{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;padding:10px 14px}
details.adm + details.adm{margin-top:8px}
details.adm summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.adm summary::-webkit-details-marker{display:none}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid5 .input{height:44px;padding:0 6px;text-align:center;font-size:15px}
.setrow{display:grid;grid-template-columns:70px 1fr 18px 1fr;gap:8px;align-items:center}
.setrow .input{text-align:center;font-size:22px;font-weight:700;height:58px;padding:0}
.setrow span{text-align:center;color:var(--muted);font-weight:700}

/* Pulsables: confirman el toque */
.prow,.chip,.icon-btn,.act,.mrow,.tile,.seg button,.tabs button,.link{transition:transform 160ms var(--ease),background-color 160ms ease,color 160ms ease}
.prow:active,.mrow:active{transform:scale(.985)}
.chip:active,.icon-btn:active,.seg button:active,.tabs button:active{transform:scale(.96)}
.act:active{transform:scale(.9)}
.act svg{transition:transform 200ms var(--ease)}
.act.liked svg{animation:pop 260ms var(--ease)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.stake{padding:14px}
.stake.hot{outline:1.5px solid var(--orange)}
.stk-h b{display:block;font-size:15.5px}
.stk-h span{font-size:12.5px;font-weight:700;color:var(--muted)}
.stake.hot .stk-h span{color:var(--orange)}
.stk-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stk{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.stk b{display:block;font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stk span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.25}
.stk.ok{background:var(--ok-soft)}.stk.ok b,.stk.ok span{color:var(--ok)}
.stk.bad b{color:var(--bad)}
.stk-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stk-col{background:var(--soft);border-radius:14px;padding:11px 8px;text-align:center}
.stk-col.ok{background:var(--ok-soft)}
.stk-cap{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stk-col.ok .stk-cap{color:var(--ok)}
.stk-col b{display:block;font-size:27px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stk-col.ok b{color:var(--ok)}
.stk-sub{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.25}
.stk-col.ok .stk-sub{color:var(--ok)}
.stk-lv{display:block;font-size:13.5px;font-weight:800;margin-top:8px;padding-top:7px;border-top:1px solid rgba(15,23,32,.09)}
.stk-col.ok .stk-lv{border-top-color:rgba(31,157,107,.22)}
.stk-foot{margin:10px 0 0;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.note{margin:8px 0 0;background:var(--soft);border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.4;color:var(--muted);font-weight:600}
.note b{color:var(--ink);font-weight:800}
.langsw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--soft)}
.langsw button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--navy);color:#fff}
.langsw.dark{background:rgba(255,255,255,.1)}
.langsw.dark button{color:rgba(255,255,255,.7)}
.langsw.dark button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.promo-line{margin:12px 6px 0;font-size:12.5px;line-height:1.4;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-line::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:middle}
.promo{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:18px;background:var(--orange-soft);border:1px solid rgba(227,91,42,.35);font-size:14px;line-height:1.35}
.promo b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.promo.dark{background:rgba(227,91,42,.16);border-color:rgba(247,162,126,.4);color:rgba(255,255,255,.9);text-align:center;max-width:320px}
.promo.dark b{color:var(--peach)}
/* ── Movimiento ─────────────────────────────────────────────────────── */
.screen.push{animation:pushIn 280ms var(--ease) both}
.screen.pop{animation:popIn 240ms var(--ease) both}
.screen.still{animation:none}
.screen.tab-r{animation:tabR 260ms var(--ease) both}
.screen.tab-l{animation:tabL 260ms var(--ease) both}
@keyframes tabR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes tabL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.rise{animation:rise 340ms var(--ease) backwards;animation-delay:calc(var(--i,0) * 24ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* Pestañas con pastilla que se desliza */
.tabs.slide{position:relative}
.tabs.slide::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 12px) / 2);border-radius:999px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);
  transform:translateX(calc(var(--t,0) * (100% + 4px)));transition:transform 300ms var(--ease-ios)}
.tabs.slide button{position:relative;z-index:1;transition:color 220ms ease,transform 160ms var(--ease)}
.tabs.slide button[aria-selected="true"]{background:transparent;box-shadow:none;color:var(--navy)}
.tabs.slide button:active{transform:scale(.96)}
/* Esqueletos de carga (aparecen solo si la carga tarda) */
.skel{animation:fadeIn 220ms 120ms ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sk{position:relative;overflow:hidden;background:rgba(18,41,74,.07);border-radius:18px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.15s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-row{height:56px}
.sk-card{width:min(272px,78vw);aspect-ratio:3/3.85;margin:56px auto 0;border-radius:26px}
/* Hojas: salida animada y asa para arrastrar */
.sheet-bg.out{animation:fadeOut 200ms ease-out both;pointer-events:none}
.sheet-bg.out .sheet{animation:sheetDown 220ms var(--ease) both}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetDown{to{transform:translateY(110%)}}
.grab{height:24px;margin:-16px -22px 4px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:40px;height:5px;border-radius:9px;background:rgba(15,23,32,.16)}
.toast.out{animation:toastOut 180ms ease-out both}
@keyframes toastOut{to{transform:translate(-50%,14px);opacity:0}}
.btn .bspin{width:18px;height:18px;border-radius:50%;border:2.2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 600ms linear infinite}
.btn.ghost .bspin{border-color:rgba(15,23,32,.14);border-top-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>

  "Puedes retar a cualquier jugador. Tiene 7 días para responder; si no contesta, el reto caduca y no pasa nada.": "You can challenge any player. They have 7 days to reply; if they don't, the challenge expires and nothing happens.",
  "Rechazar un reto no penaliza. Si lo que no te va es la hora, propón otra en vez de rechazar.": "Declining a challenge carries no penalty. If the time is the problem, suggest another one instead of declining.",
  "Cuentan como máximo 3 partidos por semana, y 1 solo partido contra cada rival en toda la temporada.": "A maximum of 3 matches a week count, and only 1 match against each opponent for the whole season.",
  "Las pistas se reservan en el club, como siempre.": "Courts are booked at the club, as usual.",
  "Después del partido, uno pone el resultado y el otro lo confirma. Si no contesta en 48 horas, se da por bueno.": "After the match one of you enters the result and the other confirms it. If they don't reply within 48 hours, it stands.",
  "Si no estáis de acuerdo, decide el club.": "If you disagree, the club decides.",
  "Ganas: 3 puntos. Pierdes en 3 sets: 1 punto. Pierdes en 2 sets: 0 puntos.": "You win: 3 points. You lose in 3 sets: 1 point. You lose in 2 sets: 0 points.",
  "Un punto extra si ganas a alguien con 5 niveles o más por encima de ti. No cuenta si alguno de los dos está en sus 5 primeros partidos.": "One extra point if you beat someone 5 levels or more above you. It doesn't count if either of you is in their first 5 matches.",
  "Va del 50 al 99 y lo mueven tus partidos: a quién ganas y por cuántos juegos. Ganar a alguien mejor sube mucho; perder ajustado contra alguien mejor casi no resta.": "It runs from 50 to 99 and your matches move it: who you beat and by how many games. Beating someone better raises it a lot; losing narrowly to someone better barely lowers it.",
  "En tus 5 primeros partidos se mueve más rápido, para colocarte pronto donde te toca.": "In your first 5 matches it moves faster, so you land where you belong quickly.",
  "Desde el día 30 solo puedes retar a tu grupo de 8 de la clasificación (1.º–8.º, 9.º–16.º, 17.º–24.º, 25.º en adelante) y a los grupos de justo encima y justo debajo.": "From day 30 you can only challenge your own group of 8 in the standings (1st–8th, 9th–16th, 17th–24th, 25th and up) and the groups just above and just below.",
  "Para entrar en un Máster hay que haber jugado al menos 5 partidos. Los cuadros son de 8 según la clasificación por puntos: Oro, Plata, Bronce y Challenger.": "To enter a Masters you need at least 5 matches played. The draws are groups of 8 from the points standings: Gold, Silver, Bronze and Challenger.",
  "Al entrar, tu nivel se recoloca en la banda de tu grupo (Oro 81–99, Plata 71–80, Bronce 61–70, Challenger 50–60) y la tarjeta pasa a ser la de tu grupo. Nunca baja: si ya lo tenías más alto, se queda como está.": "On entry your level moves into your group's band (Gold 81–99, Silver 71–80, Bronze 61–70, Challenger 50–60) and your card becomes your group's. It never goes down: if yours was already higher, it stays.",
  "Los 5 primeros partidos de la temporada con resultado confirmado llevan pista y bolas gratis. El club avisa a los jugadores.": "The first 5 matches of the season with a confirmed result get a free court and balls. The club contacts the players.",
  "Responsable:": "Data controller:",
  "Almuñécar Tennis Club. Contacto: info@almunecartennisclub.com.": "Almuñécar Tennis Club. Contact: info@almunecartennisclub.com.",
  "Qué datos guardamos:": "What data we keep:",
  "nombre y apellidos, usuario, móvil de WhatsApp, PIN (cifrado), edad, tu valoración de juego, foto si la subes, y tus retos, partidos y comentarios.": "full name, username, WhatsApp mobile, PIN (encrypted), age, your game ratings, a photo if you upload one, and your challenges, matches and comments.",
  "Para qué:": "What for:",
  "para gestionar el ranking del club, enviarte los avisos que elijas y recuperar tu PIN. La base legal es tu consentimiento al registrarte.": "to run the club ranking, send you the notifications you choose and reset your PIN. The legal basis is your consent when you sign up.",
  "Quién lo ve:": "Who sees it:",
  "solo los jugadores registrados ven el ranking, los perfiles y el tablón. Tu móvil no se muestra a nadie; de tu edad solo se ve la franja (Junior, +20, +30…). La edad solo sirve para comprobar que tienes 14 años o más y para proteger a los menores (los retos con menores no llevan mensaje).": "only registered players see the ranking, profiles and board. Your mobile is never shown to anyone, and of your age only the band is visible (Junior, +20, +30…). Age is only used to check you are 14 or older and to protect minors (challenges involving minors carry no message).",
  "Proveedores:": "Providers:",
  "la app funciona con Netlify (web), Supabase (base de datos, servidores en la UE) y WhatsApp de Meta (avisos), que tratan los datos solo por encargo del club.": "the app runs on Netlify (web), Supabase (database, servers in the EU) and Meta's WhatsApp (notices), which process data only on behalf of the club.",

    try { r = await go1(); } catch (e) { r = null; }

/* La carta se inclina hacia el dedo (o el ratón) y brilla; al soltar vuelve con un pequeño rebote. */
function bindTilt(root) {
  const el = root && root.querySelector('.fut');
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const set = (e) => {
    const r = el.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    el.style.setProperty('--ry', ((x - 0.5) * 16).toFixed(2) + 'deg');
    el.style.setProperty('--rx', ((0.5 - y) * 12).toFixed(2) + 'deg');
    el.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    el.style.setProperty('--glare', '1');
  };
  const reset = () => { el.classList.remove('tilting'); el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); el.style.setProperty('--glare', '0'); };
  el.addEventListener('pointerdown', (e) => { el.classList.add('tilting'); set(e); });
  el.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || el.classList.contains('tilting')) { el.classList.add('tilting'); set(e); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, reset));
}
function spark(levels) {
  if (levels.length < 2) return '';
  const min = Math.min(...levels) - 1, max = Math.max(...levels) + 1;
  const pts = levels.map((v, i) => `${(i / (levels.length - 1) * 100).toFixed(1)},${(28 - (v - min) / (max - min) * 26 - 1).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" role="img" aria-label="Evolución del nivel en los últimos partidos"><polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* Selector de día y hora (retos y contrapropuestas) */
function whenPicker(id) {
  const now = madridNow();
  const t = S.season && S.season.starts_on > today() ? S.season.starts_on : today();   // antes del inicio, desde el primer día
  const days = [];
  for (let i = 0; i < 10; i++) {
    const d = addDays(t, i);
    if (S.season && d > S.season.ends_on) break;
    const dt = new Date(d + 'T12:00:00Z');
    days.push({ d, top: d === today() ? 'Hoy' : d === addDays(today(), 1) ? 'Mañana' : DAYS_S[dt.getUTCDay()], bottom: `${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()].slice(0, 3)}` });
  }
  const hours = ['09:00','10:30','12:00','17:00','18:30','20:00'];
  return `<div id="${id}">
    <div class="label" style="margin:18px 0 8px 2px">Día</div>
    <div class="chips" data-k="date">${days.map((x) => `<button type="button" class="chip" data-v="${x.d}" aria-pressed="false">${x.top}<small>${x.bottom}</small></button>`).join('')}</div>
    <div class="label" style="margin:14px 0 8px 2px">Hora</div>
    <div class="chips" data-k="time">${hours.map((h) => `<button type="button" class="chip" data-v="${h}" aria-pressed="false">${h}</button>`).join('')}
      <button type="button" class="chip" data-v="other" aria-pressed="false">Otra</button></div>
    <input class="input hidden" type="time" step="900" data-other style="margin-top:8px" aria-label="Otra hora">
  </div>`;
}
function bindWhen(root) {
  const val = { date: null, time: null };
  root.querySelectorAll('.chips').forEach((group) => {
    group.addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      group.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      const k = group.dataset.k;
      if (k === 'time') {
        const other = root.querySelector('[data-other]');
        other.classList.toggle('hidden', b.dataset.v !== 'other');
        if (b.dataset.v === 'other') { other.focus(); val.time = other.value || null; } else val.time = b.dataset.v;
      } else val.date = b.dataset.v;
    });
  });
  root.querySelector('[data-other]').addEventListener('input', (e) => { val.time = e.target.value || null; });
  return () => {
    if (!val.date) throw new Error('Elige el día.');
    if (!val.time) throw new Error('Elige la hora.');
    if (`${val.date} ${val.time}` <= madridNow()) throw new Error('Esa hora ya ha pasado.');
    return val;
  };
}

/* ── Clasificación ──────────────────────────────────────────────────── */
const dm = (d) => { const [, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}/${m}`; };
const daysBetween = (a, b) => Math.round((Date.parse(String(b).slice(0, 10)) - Date.parse(String(a).slice(0, 10))) / 864e5);
const nextDay = (d) => new Date(Date.parse(String(d).slice(0, 10)) + 864e5).toISOString().slice(0, 10);
function seasonSub(sv) {
  if (sv.phase === 'closed') return 'Temporada terminada';
  if (sv.phase === 'masters') return `Másters en juego · hasta el ${dm(sv.masters_end)}`;
  const t = today();
  if (!sv.started) {
    const n = daysBetween(t, sv.starts_on);
    return (n <= 1 ? 'Empieza mañana' : `Empieza en ${n} días`) + (sv.challengesOpen ? ' · ya puedes retar' : '');
  }
  if (sv.regularOver) return `Fase regular terminada · Másters del ${dm(nextDay(sv.ends_on))} al ${dm(sv.masters_end)}`;
  const left = sv.total - sv.day;
  const pct = Math.round(sv.day / sv.total * 100);
  return `Día ${sv.day} de ${sv.total} · ${left === 0 ? 'último día' : left === 1 ? 'queda 1 día' : `quedan ${left} días`}<div class="season-bar"><i style="width:${pct}%"></i></div>`;
}
let rankTab = 'puntos', rankQuery = '';
const seasonPill = (sv) => `${sv.name} · ${sv.total} días · ${dm(sv.starts_on)} al ${dm(sv.ends_on)}`;
async function screenRanking() {
  const sv0 = S.season;
  render(`<main class="screen"><header class="rank-head hero">
    <img src="${LOGO_W}" alt="Almuñécar Tennis Club"><h1>Clasificación</h1><div class="pill" id="pill">${sv0 && sv0.total ? esc(seasonPill(sv0)) : '&nbsp;'}</div><div id="seasonsub" class="season-sub">${sv0 && sv0.total ? seasonSub(sv0) : '&nbsp;'}</div>
    <div><a class="how-link" href="#/como-funciona">¿Cómo funciona?</a></div>
    <div class="tabs slide" role="tablist" style="--t:${rankTab === 'nivel' ? 1 : 0}"><button role="tab" data-t="puntos" aria-selected="${rankTab === 'puntos'}">Puntos</button><button role="tab" data-t="nivel" aria-selected="${rankTab === 'nivel'}">Nivel</button></div>
  </header><div id="body"></div></main>${nav('ranking')}`);
  const body = document.getElementById('body');
  let D = null;
  const paint = (enter) => {
    const d = D, sv = d.season;
    const tabs = document.querySelector('.tabs'); if (tabs) tabs.style.setProperty('--t', rankTab === 'nivel' ? 1 : 0);
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === rankTab ? 'true' : 'false'));
    const q = rankQuery.trim().toLowerCase();
    const match = (r) => !q || r.full_name.toLowerCase().includes(q) || r.username.toLowerCase().includes(q);
    const row = (r, i, mode) => {
      const me = isMe(r.id);
      const tag = me ? ' · Tú' : r.provisional ? ' · provisional' : '';
      const right = mode === 'nivel'
        ? `<span class="num">${r.pj}</span><span class="big">${lvl(r.level)}</span>`
        : `<span class="num">${r.pj}</span><span class="big">${r.pts}</span>`;
      const pos = mode === 'nivel' ? i + 1 : r.pos ?? '–';
      const sub = mode === 'puntos' && !r.pos ? `Nivel ${lvl(r.level)} · ${r.missing === 1 ? 'falta 1 partido' : `faltan ${r.missing} partidos`}` : `Nivel ${lvl(r.level)}${tag}`;
      return `<a class="prow${me ? ' me' : ''}" href="#/jugador/${r.id}"><span class="pos">${pos}</span>${avatar(r, (r.pos && r.pos <= 3 && mode === 'puntos') ? 'top3' : '')}
        <span class="who"><b>${esc(r.full_name)}</b><span>${esc(sub)}</span></span>${right}</a>`;
    };
    let html = '';
    if (sv.phase === 'masters') html += `<a class="box navy row-between" href="#/masters" style="margin-top:14px;color:#fff"><span><b>Másters en juego</b><br><span style="font-size:13px;opacity:.8">Mira los cuadros y tu próximo partido</span></span>${I.trophy}</a>`;
    if (d.promo && d.promo.left > 0 && sv.phase === 'regular') html += `<p class="promo-line">${d.promo.left === d.promo.total ? `Los ${d.promo.total} primeros partidos: pista y bolas gratis.` : d.promo.left === 1 ? 'Queda 1 partido con pista y bolas gratis. ¡Corre!' : `Quedan ${d.promo.left} partidos con pista y bolas gratis. ¡Corre!`}</p>`;
    html += `<div class="search"><label class="sr" for="q">Buscar jugador</label>${I.search}<input id="q" class="input" placeholder="Buscar jugador" value="${esc(rankQuery)}" autocomplete="off"></div>`;
    if (!q && S.me && [...d.qualified, ...d.others].some((r) => isMe(r.id))) html += `<p style="margin:8px 6px 0;text-align:right"><button type="button" class="linkbtn" id="goto-me">Ir a mi puesto</button></p>`;
    if (rankTab === 'puntos') {
      const qual = d.qualified.filter(match), oth = d.others.filter(match);
      let lastZone = null;
      html += '<div class="list">';
      for (const r of qual) {
        if (r.zone !== lastZone) { lastZone = r.zone; html += `<div class="zone ${r.zone}"><span>${ZONES[r.zone][0]} · ${ZONES[r.zone][1]}</span><span>PJ · Pts</span></div>`; }
        html += row(r, 0, 'puntos');
      }
      if (oth.length) {
        html += `<div class="zone"><span>Aún sin clasificar · mínimo ${sv.min_matches} ${sv.min_matches === 1 ? 'partido' : 'partidos'}</span><span style="white-space:nowrap;flex:none">PJ · Pts</span></div>`;
        html += oth.map((r) => row(r, 0, 'puntos')).join('');
      }

      html += '</div>';
      if (!q && !qual.length && oth.length) html += `<p class="hint" style="margin:14px 6px">Los puestos de Máster aparecen cuando alguien juega ${sv.min_matches} partidos.</p>`;
    } else {
      const all = [...d.qualified, ...d.others].sort((a, b) => b.level - a.level).filter(match);
      html += `<div class="zone"><span>Por nivel</span><span>PJ · Nivel</span></div><div class="list">${all.map((r, i) => row(r, i, 'nivel')).join('') || '<div class="empty">No hay nadie con ese nombre.</div>'}</div>`;
    }
    body.innerHTML = html;
    if (enter) stagger(body);
    const gm = document.getElementById('goto-me');
    if (gm) gm.addEventListener('click', () => {
      const r = document.querySelector('.prow.me'); if (!r) return;
      r.scrollIntoView({ behavior: 'smooth', block: 'center' });
      r.style.transition = 'box-shadow .3s'; r.style.boxShadow = '0 0 0 4px rgba(227,91,42,.35)';
      setTimeout(() => { r.style.boxShadow = ''; }, 1400);
    });
    const qi = document.getElementById('q');
    qi.addEventListener('input', () => { rankQuery = qi.value; const pos = qi.selectionStart; paint(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  };
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && D && b.dataset.t !== rankTab) { rankTab = b.dataset.t; paint(true); } });
  load('ranking', 'ranking', (d, o) => {
    if (o.refresh && document.activeElement && document.activeElement.id === 'q') { D = d; return; }
    D = d; S.season = d.season;
    document.getElementById('pill').textContent = seasonPill(d.season);
    document.getElementById('seasonsub').innerHTML = seasonSub(d.season);
    paint(!o.refresh);
  }, { skeleton: () => { body.innerHTML = spinner(); } });
}

function stakesHTML(p, st) {

  return `<div class="sec"><span class="label">Lo que te juegas</span>
    <div class="box stake${extra ? ' hot' : ''}">
      <div class="stk-row">
        <div class="stk-col ok">
          <span class="stk-cap">Si ganas</span>
          <b>+${st.ptsWin}</b>
          <span class="stk-sub">${extra ? 'puntos (3 + 1 extra)' : 'puntos'}</span>
          <span class="stk-lv">${signed(st.win)} nivel</span>
        </div>
        <div class="stk-col">
          <span class="stk-cap">Si pierdes</span>
          <b>+${st.ptsLoss}</b>
          <span class="stk-sub">puntos (${st.ptsLoss3} si ganas un set)</span>
          <span class="stk-lv">${signed(st.loss)} nivel</span>

/* ── Retos ─────────────────────────────────────────────────────────── */
async function screenRetos() {

  const body = document.getElementById('body');
  body.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.act === 'accept') {
        await busy(b, () => api('POST', `challenge/${b.dataset.id}/respond`, { action: 'accept' }));
        toast('Partido aceptado. Reservad pista en el club.', true); reloadRetos();
      } else if (b.dataset.act === 'reject') {
        const text = 'Avisaremos a tu rival por WhatsApp. Si lo que no te va es la hora, mejor propón otra.';
        if (!(await confirmBox('¿No puedes jugar?', text, 'No puedo'))) return;
        await api('POST', `challenge/${b.dataset.id}/respond`, { action: 'reject' });
        toast('Hecho. Hemos avisado a tu rival.'); reloadRetos();
      } else if (b.dataset.cancel) {
        if (!(await confirmBox('¿Cancelar el reto?', 'Avisaremos a tu rival.', 'Cancelar reto', true))) return;
        await api('POST', `challenge/${b.dataset.cancel}/cancel`); toast('Reto cancelado.'); reloadRetos();
      } else if (b.dataset.withdraw) {
        await api('POST', `match/${b.dataset.withdraw}/withdraw`); toast('Resultado borrado. Ponlo otra vez.'); reloadRetos();
      } else if (b.dataset.confirm) {
        await busy(b, () => api('POST', `match/${b.dataset.confirm}/confirm`));
        toast('Resultado confirmado. Clasificación actualizada.', true); reloadRetos();
      } else if (b.dataset.dispute) {
        const note = await sheet(`<h2>¿No estás de acuerdo?</h2><p>El club revisará el resultado y os dirá algo. Si quieres, explica qué pasó.</p>
          <textarea class="input" id="note" rows="3" maxlength="300" style="margin-top:14px" placeholder="Por ejemplo: el segundo set fue 7-5 para mí"></textarea>
          <div class="btns" style="margin-top:16px"><button class="btn ghost" data-close="no">Volver</button><button class="btn navy" id="send">Avisar al club</button></div>`,
          (el, close) => el.querySelector('#send').addEventListener('click', () => close(el.querySelector('#note').value || ' ')));
        if (note === null) return;
        await api('POST', `match/${b.dataset.dispute}/dispute`, { note }); toast('Avisado. El club lo revisará.'); reloadRetos();
      }
    } catch (err) { toast(err.message); }
  });
  load('retos', 'retos', paintRetos, { skeleton: () => { body.innerHTML = spinner(); } });
}
const reloadRetos = () => load('retos', 'retos', paintRetos, { force: true });

  ].join(''));

      ${[1, 2, 3].map((n) => `<div class="setrow" style="margin-top:8px"><span class="label" style="text-align:left">${n === 3 ? '3.er set' : n + '.º set'}</span>
        <input class="input" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-s="${n - 1}" data-i="0" aria-label="Tus juegos, set ${n}">
        <span>–</span><input class="input" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-s="${n - 1}" data-i="1" aria-label="Juegos del rival, set ${n}"></div>`).join('')}
    </div>

  </main>${nav('retos')}`);
  const sets = () => [0, 1, 2].map((s) => [0, 1].map((i) => document.querySelector(`[data-s="${s}"][data-i="${i}"]`).value.trim()))
    .filter((x) => x[0] !== '' || x[1] !== '').map((x) => x.map(Number));
  const preview = () => {
    const s = sets(); let w = 0, l = 0;
    s.forEach(([a, b]) => { if (a > b) w++; else if (b > a) l++; });
    document.getElementById('preview').textContent = s.length && w !== l ? `${w > l ? 'Ganas' : 'Pierdes'} ${s.map((x) => x.join('-')).join(' ')}` : '';
  };

  }));
  const btn = document.getElementById('send');
  btn.addEventListener('click', () => busy(btn, async () => {
    try {
      const path = kind === 'c' ? `challenge/${id}/result` : `masters/${id}/result`;
      await api('POST', path, { sets: sets() });
      toast(`Enviado. Falta que ${first(rival.name)} lo confirme.`, true); go('retos');
    } catch (err) { setErr(document.getElementById('e'), err.message); }
  }));

function paintFeed() {
  const body = document.getElementById('body'); if (!body) return;
  body.innerHTML = (feedPosts.length ? `<div style="margin-top:12px">${feedPosts.map(postHTML).join('')}</div>` : '<div class="empty">Todavía no hay nada. Lanza el primer reto.</div>')
    + (feedMore ? '<div style="text-align:center;margin-top:14px"><button class="btn sm ghost" id="more">Ver más</button></div>' : '');
  body.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'more') return screenFeed(true);
    if (b.dataset.open) { openComments.add(Number(b.dataset.open)); paintFeed(); document.getElementById('c' + b.dataset.open)?.focus(); return; }
    if (b.dataset.close) { openComments.delete(Number(b.dataset.close)); paintFeed(); return; }
    try {
      if (b.dataset.like) {
        const post = feedPosts.find((x) => x.id === Number(b.dataset.like));
        post.liked = !post.liked; post.likes = (post.likes || 0) + (post.liked ? 1 : -1); paintFeed();
        const r = await api('POST', `feed/${post.id}/like`);
        post.liked = r.liked; post.likes = r.likes; paintFeed();
        return;
      }
      if (b.dataset.likers) {
        const r = await api('GET', `feed/${b.dataset.likers}/likes`);
        await sheet(`<h2>Me gusta</h2><div class="list" style="margin-top:14px">${r.players.map((pl) => `<a class="prow" href="#/jugador/${pl.id}" data-close="no">${avatar(pl)}<span class="who"><b>${esc(pl.full_name)}</b></span></a>`).join('')}</div>
          <div class="btns" style="margin-top:16px"><button class="btn ghost" data-close="no">Cerrar</button></div>`);
        return;
      }
      if (b.dataset.delc) { if (!(await confirmBox('¿Borrar el comentario?', '', 'Borrar', true))) return; await api('POST', `comment/${b.dataset.delc}/delete`); }
      if (b.dataset.delp) { if (!(await confirmBox('¿Borrar esta publicación?', 'Se borra para todos, con sus comentarios.', 'Borrar', true))) return; await api('POST', `admin/feed/${b.dataset.delp}/delete`); }
      await reloadFeed();
    } catch (err) { toast(err.message); }
  };
  body.onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target.closest('.cform'); if (!f) return;
    const inp = f.querySelector('input'); if (!inp.value.trim()) return;
    try { await busy(f.querySelector('button'), () => api('POST', `feed/${f.dataset.post}/comment`, { body: inp.value })); await reloadFeed(); }
    catch (err) { toast(err.message); }
  };
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S2 = 320, c = document.createElement('canvas'); c.width = S2; c.height = S2;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S2, S2);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('No se ha podido leer esa imagen.'));
    img.src = URL.createObjectURL(file);
  });
}

    </ul>
    <h3>Puntos</h3>
    <ul>
      <li>Ganas: 3 puntos. Pierdes en 3 sets: 1 punto. Pierdes en 2 sets: 0 puntos.</li>
      <li>Un punto extra si ganas a alguien con 5 niveles o más por encima de ti. No cuenta si alguno de los dos está en sus 5 primeros partidos.</li>
    </ul>
    <h3>Nivel</h3>
    <ul>
      <li>Va del 50 al 99 y lo mueven tus partidos: a quién ganas y por cuántos juegos. Ganar a alguien mejor sube mucho; perder ajustado contra alguien mejor casi no resta.</li>
      <li>En tus 5 primeros partidos se mueve más rápido, para colocarte pronto donde te toca.</li>
    </ul>
    <h3>Másters</h3>
    <ul>
      <li>Desde el día 30 solo puedes retar a tu grupo de 8 de la clasificación (1.º–8.º, 9.º–16.º, 17.º–24.º, 25.º en adelante) y a los grupos de justo encima y justo debajo.</li>
      <li>Para entrar en un Máster hay que haber jugado al menos 5 partidos. Los cuadros son de 8 según la clasificación por puntos: Oro, Plata, Bronce y Challenger.</li>
      <li>Al entrar, tu nivel se recoloca en la banda de tu grupo (Oro 81–99, Plata 71–80, Bronce 61–70, Challenger 50–60) y la tarjeta pasa a ser la de tu grupo. Nunca baja: si ya lo tenías más alto, se queda como está.</li>
    </ul>
    <h3>Promoción de estreno</h3>
    <ul>
      <li>Los 5 primeros partidos de la temporada con resultado confirmado llevan pista y bolas gratis. El club avisa a los jugadores.</li>
    </ul>
    <h2>Política de privacidad</h2>
    <p><b>Responsable:</b> Almuñécar Tennis Club. Contacto: info@almunecartennisclub.com.</p>
    <p><b>Qué datos guardamos:</b> nombre y apellidos, usuario, móvil de WhatsApp, PIN (cifrado), edad, tu valoración de juego, foto si la subes, y tus retos, partidos y comentarios.</p>
    <p><b>Para qué:</b> para gestionar el ranking del club, enviarte los avisos que elijas y recuperar tu PIN. La base legal es tu consentimiento al registrarte.</p>
    <p><b>Quién lo ve:</b> solo los jugadores registrados ven el ranking, los perfiles y el tablón. Tu móvil no se muestra a nadie; de tu edad solo se ve la franja (Junior, +20, +30…). La edad solo sirve para comprobar que tienes 14 años o más y para proteger a los menores (los retos con menores no llevan mensaje).</p>
    <p><b>Proveedores:</b> la app funciona con Netlify (web), Supabase (base de datos, servidores en la UE) y WhatsApp de Meta (avisos), que tratan los datos solo por encargo del club.</p>
    <p><b>Cuánto tiempo:</b> mientras tengas cuenta. Puedes borrarla cuando quieras desde Ajustes; tus partidos se mantienen de forma anónima para no alterar la clasificación de tus rivales.</p>
    <p><b>Tus derechos:</b> puedes pedir acceso, rectificación, supresión, oposición o portabilidad escribiendo a info@almunecartennisclub.com, y reclamar ante la Agencia Española de Protección de Datos (aepd.es).</p>
    <p><b>Menores:</b> para registrarse hay que tener al menos 14 años.</p>
  </main>`);
}

        if (!r.ok) throw new Error('No se ha podido exportar.');

        setTimeout(() => URL.revokeObjectURL(a.href), 2000);

    } catch (err) { toast(err.message); }
  });
  root.addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    try {
      if (f.id === 'sf') {
        await busy(f.querySelector('button'), () => api('POST', 'admin/season', { name: f.name.value, starts_on: f.starts_on.value, ends_on: f.ends_on.value, masters_end: f.masters_end.value, min_matches: Number(f.min_matches.value) }));

    } catch (err) { toast(err.message); }
  });
}

/* ════════════════════════════════════════════════════════════════════
   Router
   ════════════════════════════════════════════════════════════════════ */
function go(path) { const h = '#/' + path; if (location.hash === h) route(); else location.hash = h; }
const PUBLIC = new Set(['login', 'registro', 'registro/carta', 'olvide', 'privacidad', 'como-funciona', 'diag']);
const DEPTH = { '': 0, ranking: 0, retos: 0, tablon: 0, perfil: 0, jugador: 1, masters: 1, ajustes: 1, carta: 2, privacidad: 1, reto: 1, resultado: 1, master: 1, retar: 2, admin: 2 };
let lastDepth = null, lastTab = -1;
async function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const q = new URLSearchParams(qs || '');
  const parts = path.split('/');
  seq++;
  const dp = DEPTH[parts[0]] ?? 0;
  const tab = TAB_KEYS.indexOf(parts[0] || 'ranking');
  NAV_DIR = lastDepth === null ? '' : dp > lastDepth ? 'push' : dp < lastDepth ? 'pop'
    : dp === 0 && tab >= 0 && lastTab >= 0 && tab !== lastTab ? (tab > lastTab ? 'tab-r' : 'tab-l') : '';
  lastDepth = dp; if (dp === 0) lastTab = tab;
  if (!S.token && !PUBLIC.has(path)) {
    if (path) sessionStorage.setItem('atc_next', raw);
    return screenLogin();
  }
  if (S.token && !S.me) {
    // Al abrir la app se usa lo guardado y se comprueba la sesión por detrás (arranque instantáneo)
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('atc_me') || 'null'); } catch (e) {}
    if (saved && saved.t === tokTag() && saved.me) {
      S.me = saved.me; S.season = saved.season; S.todo = saved.todo || 0; S.board = saved.board || 0;
      refreshMe().then(updateDot).catch(() => {});
    } else {
      try { await refreshMe(); } catch (e) { if (!S.token) return; return errorScreen(e); }
    }
  }
  if (S.token && ['login', 'registro', 'registro/carta', 'olvide'].includes(path)) return go('');
  switch (parts[0]) {
    case '': case 'ranking': return screenRanking();
    case 'login': return screenLogin();
    case 'registro': return parts[1] === 'carta' ? screenSignup2() : screenSignup1();
    case 'olvide': return screenForgot();
    case 'privacidad': return screenPrivacy();
    case 'como-funciona': return screenHow();
    case 'jugador': return screenPlayer(parts[1]);
    case 'perfil': return screenPlayer(null);
    case 'retar': return screenChallenge(parts[1]);
    case 'retos': return screenRetos();
    case 'reto': return screenCounter(parts[1]);
    case 'resultado': return screenResult('c', parts[1]);
    case 'master': return screenResult('m', parts[1]);
    case 'tablon': return screenFeed();
    case 'masters': return screenMasters();
    case 'ajustes': return screenSettings();
    case 'carta': return screenEditCard();
    case 'admin': return screenAdmin();
    case 'diag': {
      const vv = window.visualViewport, cs = getComputedStyle(document.documentElement);
      const rows = [['innerWidth × innerHeight', `${innerWidth} × ${innerHeight}`], ['visualViewport', vv ? `${Math.round(vv.width)} × ${Math.round(vv.height)} · top ${Math.round(vv.offsetTop)}` : '—'],
        ['clientHeight', document.documentElement.clientHeight], ['screen', `${screen.width} × ${screen.height}`], ['scrollY', scrollY],
        ['safe-area top/bottom', `${cs.getPropertyValue('--sat')} / ${cs.getPropertyValue('--sab')}`], ['shell', `${$shell.style.top} · ${$shell.style.height}`], ['navegador', navigator.userAgent]];
      return render(`<main class="screen nonav"><h1 class="h" style="font-size:24px">Diagnóstico de pantalla</h1><p class="sub">Haz una captura y mándasela a quien te ayuda con la app.</p>
        <div class="box" style="margin-top:14px">${rows.map(([k, v]) => `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><b>${k}</b><br>${esc(String(v))}</div>`).join('')}</div>
        <div class="box" style="margin-top:12px;font-size:13px" id="speed"><b>Velocidad</b><br>Midiendo…</div>
        <div style="position:fixed;left:0;right:0;top:0;height:4px;background:red"></div><div style="position:fixed;left:0;right:0;bottom:0;height:4px;background:red"></div></main>`),
      (async () => {
        const box = document.getElementById('speed');
        try {
          const t = performance.now(); const r = await fetch('/api/ping', { cache: 'no-store' }); const d = await r.json(); const tot = Math.round(performance.now() - t);
          const t2 = performance.now(); await fetch('/api/ping', { cache: 'no-store' }); const tot2 = Math.round(performance.now() - t2);
          if (box) box.innerHTML = `<b>Velocidad</b><br>Servidor: ${esc(d.region)}<br>Base de datos: ${d.dbMs} ms por consulta (primera ${d.dbFirstMs} ms)<br>Petición completa: ${tot} ms · repetida ${tot2} ms`;
        } catch (e) { if (box) box.innerHTML = '<b>Velocidad</b><br>No se pudo medir.'; }
      })();
    }
    default: return go('');
  }
}
cacheLoad();
// URLs sin hash para Meta / validadores externos
if (location.pathname === '/privacy' || location.pathname === '/privacidad') { history.replaceState(null, '', '/#/privacidad'); }
window.addEventListener('hashchange', route);
// tocar la pestaña en la que ya estás la recarga
document.addEventListener('click', (e) => { const l = e.target.closest('a[href^="#/"]'); if (l && l.getAttribute('href') === location.hash) { e.preventDefault(); route(); } });
route();
</script>
