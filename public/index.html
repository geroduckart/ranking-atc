<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12294A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranking ATC">
<meta name="robots" content="noindex, nofollow">
<title>Ranking ATC · Almuñécar Tennis Club</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF8;--card:#FFFFFF;--ink:#0F1720;--muted:#546073;--line:#E0E2E8;--soft:#EEF0F4;
  --navy:#12294A;--navy-2:#0B1B33;--navy-3:#1A3760;--orange:#E35B2A;--orange-hover:#CC5224;--orange-soft:#FCEDE6;--peach:#F7A27E;
  --ok:#1F9D6B;--ok-soft:#E8F6F0;--bad:#B8431A;--gold:#F4E2A1;
  --font:'Figtree',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  /* Liquid glass */
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.78);--glass-line:rgba(255,255,255,.75);
  --glass-blur:blur(22px) saturate(180%);
  --glass-shadow:0 10px 30px rgba(15,23,32,.12),0 1px 2px rgba(15,23,32,.06),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25);
  --card:rgba(255,255,255,.82);--card-line:rgba(255,255,255,.9);--card-shadow:0 1px 2px rgba(15,23,32,.05),0 6px 18px rgba(15,23,32,.05);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 100% 0%,rgba(227,91,42,.10),transparent 70%),radial-gradient(70% 50% at 0% 100%,rgba(18,41,74,.10),transparent 70%),radial-gradient(50% 35% at 0% 20%,rgba(244,226,161,.18),transparent 70%),#F3F1ED}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
#scroll{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;background:transparent;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--orange);text-decoration:none}
img{display:block}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.screen{padding:calc(12px + var(--sat)) 18px calc(124px + var(--sab));animation:fadeIn 260ms var(--ease) both}
.screen.nonav{padding-bottom:calc(32px + var(--sab))}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botones */
.btn{box-shadow:0 6px 18px rgba(227,91,42,.28),inset 0 1px 0 rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 26px;border-radius:999px;border:0;font-weight:700;font-size:17px;background:var(--orange);color:#fff;text-decoration:none;transition:transform 120ms,background 160ms}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--orange-hover)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.navy{background:var(--navy);box-shadow:0 6px 18px rgba(18,41,74,.25),inset 0 1px 0 rgba(255,255,255,.15)}.btn.navy:hover{background:var(--navy-3)}
.btn.ghost{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink)}.btn.ghost:hover{background:#fff}
.btn.ghost-dark{background:rgba(255,255,255,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.btn.block{width:100%}
.btn.sm{height:44px;font-size:15px;padding:0 18px}
.btn.xs{height:36px;font-size:14px;padding:0 14px}
.icon-btn{width:44px;height:44px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.link{background:none;border:0;padding:6px 0;font-weight:700;font-size:14px;color:var(--muted)}
.link.orange{color:var(--orange)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input{height:54px;border-radius:16px;border:1px solid rgba(224,226,232,.9);background:rgba(255,255,255,.85);font-size:17px;font-weight:500;padding:0 16px;color:var(--ink);width:100%;outline:none;transition:border-color 160ms,box-shadow 160ms}
.input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,41,74,.12)}
textarea.input{height:auto;padding:12px 14px;resize:none;font-size:15px;line-height:1.4}
.dark .input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
.dark .input::placeholder{color:rgba(255,255,255,.45)}
.dark .input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.dark .field{color:rgba(255,255,255,.75)}
.hint{font-size:13px;line-height:1.45;color:var(--muted);margin:0}
.err{background:#FCEDE6;color:#9B3511;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted)}
.check input{width:20px;height:20px;margin:0;accent-color:var(--navy);flex:none}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:rgba(238,240,244,.7);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.7)}
.seg button{height:38px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(18,41,74,.25)}
.dark .seg{background:rgba(255,255,255,.08)}
.dark .seg button{color:rgba(255,255,255,.8)}
.dark .seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:64px;height:48px;padding:0 14px;border-radius:16px;border:1px solid var(--card-line);background:var(--card);box-shadow:var(--card-shadow);color:var(--ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip small{font-size:11px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(to right,var(--navy) var(--p),var(--line) var(--p));outline:none;margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.18)}
.slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--orange)}

/* Cabeceras */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;position:sticky;top:calc(8px + var(--sat));z-index:15}
.top .title{padding:9px 16px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.top .title{font-size:16px;font-weight:700}
h1.h{margin:16px 0 0;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--navy-3) 0%,var(--navy) 50%,var(--navy-2) 100%);color:#fff}
.rank-head{margin:calc(-12px - var(--sat)) -18px 0;padding:calc(20px + var(--sat)) 20px 18px;border-radius:0 0 30px 30px;box-shadow:0 12px 30px rgba(11,27,51,.22);text-align:center;display:flex;flex-direction:column;align-items:center}
.rank-head img{width:140px;height:auto}
.rank-head h1{margin:12px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1)}
.pill.light{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.07),inset 0 1px 0 rgba(255,255,255,.9);font-size:13px;padding:7px 12px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid rgba(255,255,255,.14);width:100%;margin-top:14px}
.tabs button{height:38px;border-radius:999px;border:0;background:transparent;color:rgba(255,255,255,.8);font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tabs.light{background:var(--soft)}
.tabs.light button{color:var(--muted)}
.tabs.light button[aria-selected="true"]{background:var(--navy);color:#fff}

/* Listas */
.list{display:flex;flex-direction:column;gap:6px}
.zone{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px}
.zone.oro{color:#A47F2A}.zone.plata{color:#6B7482}.zone.bronce{color:#9C6537}.zone.challenger{color:var(--navy)}
.prow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px;border-radius:18px;background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);color:var(--ink);text-decoration:none}
.prow.me{background:rgba(252,237,230,.92);border:1.5px solid var(--orange)}
.prow .pos{width:24px;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.prow .who{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who span{font-size:12px;color:var(--muted);font-weight:600}
.prow .num{width:30px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .big{min-width:36px;text-align:right;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--navy);overflow:hidden;object-fit:cover}
.av.top3{background:var(--navy);color:var(--gold)}
.av.lg{width:56px;height:56px;font-size:18px}
.av.xl{width:84px;height:84px;font-size:26px}
.search{position:relative;margin-top:12px}
.search input{padding-left:42px;height:46px;font-size:15px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(15,23,32,.06)}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;font-size:15px;line-height:1.5}

/* Tarjetas */
.box{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:22px;padding:14px 16px}
.box.navy{background:radial-gradient(120% 120% at 90% 0%,var(--navy-3),var(--navy) 55%,var(--navy-2));border-color:rgba(255,255,255,.08);color:#fff;box-shadow:0 12px 30px rgba(11,27,51,.22)}
.box + .box{margin-top:10px}
.sec{margin-top:22px}
.sec > .label{display:block;margin:0 0 8px 4px}
.kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.when{font-size:14px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;padding:10px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:700}
.tile span{font-size:12px;font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--navy)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--orange-soft);color:var(--bad)}
.wl{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:3px 6px;background:var(--ok)}
.wl.l{background:var(--bad)}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:16px;padding:10px 12px;color:var(--ink)}
.mrow .r{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .s{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;white-space:nowrap;padding:0 12px}

/* Carta */
.fut-wrap{display:flex;flex-direction:column;align-items:center}
.fut{position:relative;width:min(272px,78vw);aspect-ratio:3/3.85;padding:20px 24px 16px;color:var(--navy);overflow:hidden;
  clip-path:polygon(50% 0,100% 6%,100% 88%,50% 100%,0 88%,0 6%);
  background:linear-gradient(155deg,#F4E2A1 0%,#D8B65A 45%,#B8913A 100%);filter:drop-shadow(0 18px 30px rgba(15,23,32,.18));animation:cardIn 600ms var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.fut.silver{background:linear-gradient(155deg,#F1F3F6 0%,#C9CED6 50%,#9DA5B1 100%)}
.fut.bronze{background:linear-gradient(155deg,#F0CDA8 0%,#C98F5B 50%,#9C6537 100%)}
.fut.special{background:radial-gradient(120% 80% at 80% 0%,#1D3A66 0%,#12294A 45%,#0B1B33 100%);color:#fff}
.fut-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.fut-lvl{display:flex;flex-direction:column;align-items:center;line-height:1}
.fut-lvl b{font-size:50px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fut.special .fut-lvl b,.fut.special .fs b{color:var(--orange)}
.fut-lvl span{font-size:11px;font-weight:700;letter-spacing:.16em;margin-top:3px}
.fut-lvl i{font-style:normal;font-size:10px;font-weight:700;margin-top:6px;padding:3px 8px;border-radius:999px;background:rgba(18,41,74,.12)}
.fut.special .fut-lvl i{background:rgba(255,255,255,.14)}
.fut-photo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.6);margin-top:2px}
.fut-logo{width:96px;height:auto;margin-top:8px;opacity:.9}
.fut-name{font-size:19px;font-weight:700;letter-spacing:.06em;text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(18,41,74,.2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut.special .fut-name{border-color:rgba(255,255,255,.2)}
.fut-tier{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.65;margin-top:2px}
.fut-stats{display:flex;flex-direction:column;gap:2px;margin:8px 6px 0}
.fs{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(18,41,74,.1);padding-bottom:1px}
.fut.special .fs{border-color:rgba(255,255,255,.08)}
.fs span{font-size:13.5px;font-weight:600;opacity:.9}
.fs b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{width:100%;height:46px}

.pagehead{padding:10px 2px 0}
/* Barra inferior */
.nav{position:fixed;z-index:30;left:0;right:0;bottom:calc(10px + var(--sab));margin:0 auto;width:calc(100% - 28px);max-width:452px;height:68px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:6px;border-radius:999px;
  background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 40px rgba(15,23,32,.18),0 2px 6px rgba(15,23,32,.06),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);
  -webkit-transform:translateZ(0);transform:translateZ(0)}
.nav a{height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative;transition:background 200ms,color 200ms}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--orange);background:rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(15,23,32,.10),inset 0 1px 0 #fff}
.nav .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

/* Login */
.login{min-height:100vh;min-height:100dvh;padding:calc(48px + var(--sat)) 26px calc(28px + var(--sab));display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.login .ring{position:absolute;border-radius:50%;pointer-events:none}
.login h1{margin:12px 0 0;font-size:56px;line-height:.95;font-weight:700;letter-spacing:-.03em;text-align:center}
.login h1 span{color:var(--orange)}
.login form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:28px;position:relative}
.or{width:100%;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.or p{margin:0;font-size:15px;color:rgba(255,255,255,.8)}

/* Tablón (compacto, tipo Instagram) */
.post{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:20px;padding:12px 14px 8px}
.post.admin{background:radial-gradient(120% 120% at 90% 0%,var(--navy-3),var(--navy) 55%,var(--navy-2));border-color:rgba(255,255,255,.08);color:#fff;box-shadow:0 12px 30px rgba(11,27,51,.22)}
.post + .post{margin-top:8px}
.ph{display:flex;align-items:center;gap:10px}
.ph .av{width:34px;height:34px;font-size:12px}
.ph .meta{flex:1;min-width:0;line-height:1.25}
.ph .kind{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.ph .t{font-size:12px;font-weight:600;color:var(--muted)}
.post.admin .ph .t{color:rgba(255,255,255,.6)}
.post .txt{margin-top:8px;font-size:15px;font-weight:700;line-height:1.35}
.post .txt em{font-style:normal;font-weight:500;color:var(--muted)}
.post .body{margin-top:8px;font-size:15px;line-height:1.45;white-space:pre-line;font-weight:500}
.post .sub2{margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}
.score{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score b{font-size:18px;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.act{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 8px;border:0;background:none;border-radius:999px;color:var(--ink);font-size:14px;font-weight:700}
.act svg{width:22px;height:22px}
.act.liked{color:#E0245E}
.act.liked svg{fill:#E0245E;stroke:#E0245E}
.act:active svg{transform:scale(1.2)}
.post.admin .act{color:#fff}
.act.del{margin-left:auto;color:var(--muted);font-size:12px}
.post.admin .act.del{color:rgba(255,255,255,.6)}
.likers{background:none;border:0;padding:0;font-size:13.5px;font-weight:700;color:inherit}
.prev{margin-top:4px;font-size:14px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev b{margin-right:4px}
.more{background:none;border:0;padding:2px 0;font-size:13.5px;font-weight:600;color:var(--muted);display:block}
.post.admin .more{color:rgba(255,255,255,.65)}
.comments{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post.admin .comments{border-color:rgba(255,255,255,.15)}
.cmt{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.cmt .av{width:26px;height:26px;font-size:10px}
.cmt b{margin-right:4px}
.cmt .ct{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
.cmt .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:2px 0 2px 6px}
.cform{display:flex;gap:8px;margin:10px 0 4px}
.cform input{height:40px;font-size:15px;border-radius:999px}
.cform button{height:40px;flex:none}

/* Másters */
.round{margin-top:18px}
.bm{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;overflow:hidden}
.bm + .bm{margin-top:8px}
.bm .pl{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:15px;font-weight:600}
.bm .pl + .pl{border-top:1px solid var(--line)}
.bm .pl.w{font-weight:800}
.bm .pl .sd{width:22px;font-size:12px;color:var(--muted);font-weight:700}
.bm .pl .sc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.bm .pl.tbd{color:var(--muted);font-weight:500}
.champ{margin-top:14px;text-align:center;padding:18px;border-radius:18px;background:var(--navy);color:#fff}
.champ b{display:block;font-size:22px;margin-top:4px;color:var(--gold)}

/* Hojas y avisos */
.sheet-bg{position:fixed;inset:0;background:rgba(11,27,51,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeBg 200ms both}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{width:calc(100% - 20px);max-width:460px;margin-bottom:calc(10px + var(--sab));background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(15,23,32,.25),inset 0 1px 0 #fff;border-radius:34px;padding:24px 22px 20px;animation:sheetUp 280ms var(--ease) both;max-height:90vh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:21px;line-height:1.25}
.sheet p{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);transform:translateX(-50%);text-align:center;background:rgba(15,23,32,.82);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(15,23,32,.25);animation:toastUp 240ms var(--ease) both}
@keyframes toastUp{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.ok{background:rgba(31,157,107,.88)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin 800ms linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.prose h2{font-size:18px;margin:22px 0 6px}
.prose p,.prose li{font-size:15px;line-height:1.55;color:var(--ink)}
details.adm{background:var(--card);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:18px;padding:10px 14px}
details.adm + details.adm{margin-top:8px}
details.adm summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.adm summary::-webkit-details-marker{display:none}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid5 .input{height:44px;padding:0 6px;text-align:center;font-size:15px}
.setrow{display:grid;grid-template-columns:70px 1fr 18px 1fr;gap:8px;align-items:center}
.setrow .input{text-align:center;font-size:22px;font-weight:700;height:58px;padding:0}
.setrow span{text-align:center;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div id="scroll"><div id="app"></div></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Ranking ATC — app (una sola página). Habla con /api (Netlify Functions).
   ════════════════════════════════════════════════════════════════════ */
const VERSION = '1.0.0';
const ATTRS = [['derecha','Derecha'],['reves','Revés'],['slice','Slice'],['saque1','1.er servicio'],['saque2','2.º servicio']];
const ZONES = { oro:['Máster Oro','1–8'], plata:['Máster Plata','9–16'], bronce:['Máster Bronce','17–24'], challenger:['Máster Challenger','25 en adelante'] };
const LOGO_W = '/img/club-white.png', LOGO_N = '/img/club-navy.png';
const $app = document.getElementById('app');
const S = { token: null, me: null, season: null, todo: 0, cache: {}, signup: null };
try { S.token = localStorage.getItem('atc_token'); } catch (e) {}

/* ── Utilidades ─────────────────────────────────────────────────────── */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n, d = 1) => Number(n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), d);
const lvl = (n) => Math.round(Number(n));
const first = (s) => String(s || '').trim().split(/\s+/)[0];
const initials = (s) => String(s || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DAYS_S = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function madridNow() {
  return new Intl.DateTimeFormat('sv-SE', { timeZone:'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false })
    .format(new Date()).replace('T', ' ');
}
const today = () => madridNow().slice(0, 10);
function addDays(day, n) { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmtWhen(ts, month = true) {
  const [d, t = ''] = String(ts).replace('T', ' ').split(' ');
  const dt = new Date(d + 'T12:00:00Z');
  const s = `${DAYS[dt.getUTCDay()]} ${dt.getUTCDate()}${month ? ' de ' + MONTHS[dt.getUTCMonth()] : ''}`;
  return t ? `${s} · ${t.slice(0, 5)}` : s;
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if (s < 172800) return 'ayer';
  if (s < 604800) return `hace ${Math.floor(s / 86400)} días`;
  const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
}
const tierOf = (l) => (l >= 85 ? 'special' : l >= 70 ? 'gold' : l >= 50 ? 'silver' : 'bronze');
const isMe = (id) => S.me && S.me.id === id;

const I = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trophy:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/></svg>',
  ball:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3 2.4 3 10.4 0 12.8M18.4 5.6c-3 2.4-3 10.4 0 12.8"/></svg>',
  chat:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  user:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M5 10l7-7 7 7M8 14h8l-1-4H9z"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};

/* ── API ────────────────────────────────────────────────────────────── */
async function api(method, path, body) {
  const headers = {};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch('/api/' + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Sin conexión. Revisa tu internet e inténtalo otra vez.'); }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token) { logout(true); throw new Error(data.error || 'Tu sesión ha caducado.'); }
  if (!r.ok) throw new Error(data.error || 'Algo ha fallado. Inténtalo de nuevo.');
  return data;
}
function setSession(d) {
  S.token = d.token; S.me = d.me;
  try { localStorage.setItem('atc_token', d.token); } catch (e) {}
}
function logout(expired) {
  S.token = null; S.me = null; S.cache = {};
  try { localStorage.removeItem('atc_token'); } catch (e) {}
  if (expired) toast('Tu sesión ha caducado. Vuelve a entrar.');
  go('login');
}
async function refreshMe() {
  const d = await api('GET', 'me');
  S.me = d.me; S.season = d.season; S.todo = d.todo;
  return d;
}

/* ── Interfaz común ─────────────────────────────────────────────────── */
function toast(msg, ok) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (ok ? ' ok' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
function sheet(html, onMount) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    const close = (v) => { bg.remove(); resolve(v); };
    bg.addEventListener('click', (e) => { if (e.target === bg) close(null); });
    bg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => close(b.dataset.close === 'ok' ? true : null)));
    document.body.appendChild(bg);
    if (onMount) onMount(bg.querySelector('.sheet'), close);
  });
}
const confirmBox = (title, text, okLabel = 'Sí', danger = false) => sheet(`
  <h2>${esc(title)}</h2>${text ? `<p>${text}</p>` : ''}
  <div class="btns" style="margin-top:20px"><button class="btn ghost" data-close="no">Volver</button><button class="btn ${danger ? 'navy' : ''}" data-close="ok">${esc(okLabel)}</button></div>`);

function avatar(p, cls = '') {
  if (!p) return `<span class="av ${cls}">?</span>`;
  if (p.photo_v > 0) return `<img class="av ${cls}" src="/api/photo/${p.id}?v=${p.photo_v}" alt="" loading="lazy">`;
  return `<span class="av ${cls}" aria-hidden="true">${esc(initials(p.full_name || p.name))}</span>`;
}
function nav(active) {
  const item = (href, key, icon, label, dot) => `<a href="#/${href}" ${active === key ? 'aria-current="page"' : ''}>${icon}${label}${dot ? `<span class="dot">${dot}</span>` : ''}</a>`;
  return `<nav class="nav" aria-label="Principal">
    ${item('', 'ranking', I.trophy, 'Ranking')}
    ${item('retos', 'retos', I.ball, 'Partidos', S.todo > 0 ? S.todo : '')}
    ${item('tablon', 'tablon', I.chat, 'Tablón')}
    ${item('perfil', 'perfil', I.user, 'Perfil')}</nav>`;
}
const backBtn = (href, label = 'Volver') => `<a class="icon-btn" href="#/${href}" aria-label="${esc(label)}">${I.back}</a>`;
const spinner = () => '<div class="spinner" role="progressbar" aria-label="Cargando"></div>';
const $scroll = document.getElementById('scroll');
function render(html) { $app.innerHTML = html; $scroll.scrollTop = 0; }
function errorScreen(e, back = '') {
  render(`<main class="screen"><div class="top">${backBtn(back)}<div></div><div style="width:44px"></div></div>
    <div class="empty">${esc(e.message || e)}<div style="margin-top:16px"><button class="btn sm ghost" onclick="route()">Reintentar</button></div></div></main>${S.me ? nav('') : ''}`);
}
function setErr(el, msg) { if (!el) return; el.textContent = msg || ''; el.classList.toggle('hidden', !msg); }
async function busy(btn, fn) {
  if (btn.disabled) return;
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Un momento…';
  try { return await fn(); } finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; } }
}

/* La carta del jugador (como la del Journal) */
function cardHTML(p) {
  const t = tierOf(p.level);
  const logo = t === 'special' ? LOGO_W : LOGO_N;
  const parts = String(p.full_name).trim().split(/\s+/);
  const short = parts.length > 1 ? `${parts[0][0]}. ${parts.slice(1).join(' ')}` : parts[0];
  return `<div class="fut-wrap"><div class="fut ${t}">
    <div class="fut-top">
      <div class="fut-lvl"><b>${lvl(p.level)}</b><span>NIVEL</span>${p.provisional ? '<i>PROVISIONAL</i>' : ''}</div>
      ${p.photo_v > 0 ? `<img class="fut-photo" src="/api/photo/${p.id}?v=${p.photo_v}" alt="">` : `<img class="fut-logo" src="${logo}" alt="ATC">`}
    </div>
    <div class="fut-name">${esc(short)}</div>
    <div class="fut-tier">${esc(S.season?.name || 'Temporada 1')} · ATC</div>
    <div class="fut-stats">${ATTRS.map(([k, l]) => `<div class="fs"><span>${l}</span><b>${p.attrs[k]}</b></div>`).join('')}</div>
  </div></div>`;
}
function spark(levels) {
  if (levels.length < 2) return '';
  const min = Math.min(...levels) - 1, max = Math.max(...levels) + 1;
  const pts = levels.map((v, i) => `${(i / (levels.length - 1) * 100).toFixed(1)},${(28 - (v - min) / (max - min) * 26 - 1).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" role="img" aria-label="Evolución del nivel en los últimos partidos"><polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* Selector de día y hora (retos y contrapropuestas) */
function whenPicker(id) {
  const t = today(), now = madridNow();
  const days = [];
  for (let i = 0; i < 10; i++) {
    const d = addDays(t, i);
    if (S.season && d > S.season.ends_on) break;
    const dt = new Date(d + 'T12:00:00Z');
    days.push({ d, top: i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : DAYS_S[dt.getUTCDay()], bottom: `${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()].slice(0, 3)}` });
  }
  const hours = ['09:00','10:30','12:00','17:00','18:30','20:00'];
  return `<div id="${id}">
    <div class="label" style="margin:18px 0 8px 2px">Día</div>
    <div class="chips" data-k="date">${days.map((x) => `<button type="button" class="chip" data-v="${x.d}" aria-pressed="false">${x.top}<small>${x.bottom}</small></button>`).join('')}</div>
    <div class="label" style="margin:14px 0 8px 2px">Hora</div>
    <div class="chips" data-k="time">${hours.map((h) => `<button type="button" class="chip" data-v="${h}" aria-pressed="false">${h}</button>`).join('')}
      <button type="button" class="chip" data-v="other" aria-pressed="false">Otra</button></div>
    <input class="input hidden" type="time" step="900" data-other style="margin-top:8px" aria-label="Otra hora">
  </div>`;
}
function bindWhen(root) {
  const val = { date: null, time: null };
  root.querySelectorAll('.chips').forEach((group) => {
    group.addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      group.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      const k = group.dataset.k;
      if (k === 'time') {
        const other = root.querySelector('[data-other]');
        other.classList.toggle('hidden', b.dataset.v !== 'other');
        if (b.dataset.v === 'other') { other.focus(); val.time = other.value || null; } else val.time = b.dataset.v;
      } else val.date = b.dataset.v;
    });
  });
  root.querySelector('[data-other]').addEventListener('input', (e) => { val.time = e.target.value || null; });
  return () => {
    if (!val.date) throw new Error('Elige el día.');
    if (!val.time) throw new Error('Elige la hora.');
    if (`${val.date} ${val.time}` <= madridNow()) throw new Error('Esa hora ya ha pasado.');
    return val;
  };
}

/* ════════════════════════════════════════════════════════════════════
   Pantallas
   ════════════════════════════════════════════════════════════════════ */

/* ── Acceso ─────────────────────────────────────────────────────────── */
function screenLogin() {
  render(`<main class="login hero dark">
    <div class="ring" aria-hidden="true" style="width:520px;height:520px;border:1.5px solid rgba(227,91,42,.35);right:-300px;top:150px"></div>
    <div class="ring" aria-hidden="true" style="width:420px;height:420px;border:1px solid rgba(255,255,255,.10);right:-260px;top:200px"></div>
    <img src="${LOGO_W}" alt="Almuñécar Tennis Club" style="width:200px;height:auto;position:relative">
    <div style="margin-top:40px;text-align:center;position:relative">
      <div class="label" style="color:var(--peach);letter-spacing:.18em">Temporada 1 · 60 días</div>
      <h1>Ranking<br><span>del club.</span></h1>

      <label class="field">Usuario<input class="input" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(v.username || '')}" placeholder="sin espacios, p. ej. jesusfernandez"></label>

      <p class="hint">Al email te avisaremos cuando alguien te rete. También sirve para recuperar el PIN. La fecha de nacimiento no se muestra a nadie: solo comprobamos que tienes 14 años o más.</p>
      <label class="check"><input type="checkbox" name="accept" ${v.accept ? 'checked' : ''}><span>Acepto la <a href="#/privacidad">política de privacidad</a> y las normas de la temporada.</span></label>
      <div class="err hidden" id="e"></div>
      <button class="btn block" style="margin-top:6px">Siguiente: mi carta</button>
    </form>
  </main>`);
  const f = document.getElementById('f');
  f.addEventListener('input', () => { S.signup = { ...(S.signup || {}), ...collect(f) }; });
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = collect(f);
    S.signup = { ...(S.signup || {}), ...d };
    const err = (m) => setErr(document.getElementById('e'), m);
    if (d.full_name.trim().split(/\s+/).length < 2) return err('Escribe tu nombre y al menos un apellido.');
    if (!/^[a-z0-9._]{3,20}$/.test(d.username.trim().toLowerCase())) return err('El usuario: de 3 a 20 letras o números, sin espacios ni tildes.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim())) return err('Revisa el email.');

    if (!d.accept) return err('Tienes que aceptar la política de privacidad.');
    go('registro/carta');
  });
}
function collect(f) {
  return { full_name: f.full_name.value, username: f.username.value.trim().toLowerCase(), email: f.email.value.trim(), pin: f.pin.value, birth_date: f.birth_date.value, accept: f.accept.checked };
}

function screenSignup2() {

  v.hand = v.hand || 'diestro'; v.backhand = v.backhand || 'dos';
  const mean = () => ATTRS.reduce((s, [k]) => s + v.attrs[k], 0) / ATTRS.length;
  render(`<main class="screen nonav">
    <div class="top">${backBtn('registro')}<div class="label" style="letter-spacing:.06em;text-transform:none;font-size:13px">Paso 2 de 2</div><div style="width:44px"></div></div>

      <div><div class="label" style="color:rgba(255,255,255,.65)">Tu nivel</div><div style="margin-top:4px;font-size:13px;color:rgba(255,255,255,.75)">Provisional en tus 5 primeros partidos</div></div>
      <div id="mean" style="font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums">60</div>
    </div>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
      <div class="row-between"><b style="font-size:15px">Juegas con</b><div class="seg" style="width:220px" data-k="hand"><button type="button" data-v="diestro">Diestro</button><button type="button" data-v="zurdo">Zurdo</button></div></div>
      <div class="row-between"><b style="font-size:15px">Revés</b><div class="seg" style="width:220px" data-k="backhand"><button type="button" data-v="una">A una mano</button><button type="button" data-v="dos">A dos manos</button></div></div>
    </div>
    <div style="margin-top:16px">
      ${ATTRS.map(([k, l]) => `<label style="display:block;margin-top:6px"><div class="row-between"><b style="font-size:15px">${l}</b><b id="v-${k}" style="font-size:20px;font-variant-numeric:tabular-nums">${v.attrs[k]}</b></div>
        <input class="slider" type="range" min="30" max="99" step="1" value="${v.attrs[k]}" data-k="${k}" aria-label="${l}"></label>`).join('')}
    </div>
    <p class="hint" style="margin-top:10px">Sé honesto: en tus 5 primeros partidos el nivel se ajusta muy rápido. Si te pones de más, bajarás enseguida.</p>
    <div class="err hidden" id="e" style="margin-top:10px"></div>
    <button class="btn block" id="save" style="margin-top:16px">Guardar mi carta</button>
  </main>`);
  const paint = () => {
    document.getElementById('mean').textContent = Math.round(mean());
    document.querySelectorAll('.slider').forEach((s) => s.style.setProperty('--p', ((s.value - 30) / 69 * 100) + '%'));
    document.querySelectorAll('.seg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', v[g.dataset.k] === b.dataset.v ? 'true' : 'false')));
  };
  document.querySelectorAll('.slider').forEach((s) => s.addEventListener('input', () => { v.attrs[s.dataset.k] = Number(s.value); document.getElementById('v-' + s.dataset.k).textContent = s.value; paint(); }));
  document.querySelectorAll('.seg').forEach((g) => g.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { v[g.dataset.k] = b.dataset.v; paint(); } }));
  paint();
  const btn = document.getElementById('save');
  btn.addEventListener('click', () => busy(btn, async () => {
    try {
      const d = await api('POST', 'signup', { ...v, accept: !!v.accept });
      setSession(d); S.signup = null;
      toast('¡Bienvenido al ranking! Ya puedes retar a quien quieras.', true);
      go('');
    } catch (err) {
      setErr(document.getElementById('e'), err.message);
      if (/usuario|email|PIN|nombre|fecha|años|aceptar/i.test(err.message)) setTimeout(() => go('registro'), 1600);
    }
  }));
}

/* ── Clasificación ──────────────────────────────────────────────────── */
let rankTab = 'puntos', rankQuery = '';
async function screenRanking() {
  render(`<main class="screen"><header class="rank-head hero">
    <img src="${LOGO_W}" alt="Almuñécar Tennis Club"><h1>Clasificación</h1><div class="pill" id="pill">&nbsp;</div>
    <div class="tabs" role="tablist"><button role="tab" data-t="puntos">Puntos</button><button role="tab" data-t="nivel">Nivel</button></div>
  </header><div id="body">${spinner()}</div></main>${nav('ranking')}`);
  let d;
  try { d = await api('GET', 'ranking'); } catch (e) { return errorScreen(e); }
  S.cache.ranking = d; S.season = d.season;
  const sv = d.season;
  document.getElementById('pill').textContent = sv.phase === 'regular'
    ? (sv.started ? (sv.regularOver ? `${sv.name} · fase regular terminada` : `${sv.name} · Día ${sv.day} de ${sv.total}`) : `${sv.name} · empieza el ${fmtWhen(sv.starts_on, true)}`)
    : sv.phase === 'masters' ? `${sv.name} · Másters` : `${sv.name} · terminada`;
  const paint = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === rankTab ? 'true' : 'false'));
    const q = rankQuery.trim().toLowerCase();
    const match = (r) => !q || r.full_name.toLowerCase().includes(q) || r.username.toLowerCase().includes(q);
    const row = (r, i, mode) => {
      const me = isMe(r.id);
      const tag = me ? ' · Tú' : r.provisional ? ' · provisional' : '';
      const right = mode === 'nivel'
        ? `<span class="num">${r.pj}</span><span class="big">${lvl(r.level)}</span>`
        : `<span class="num">${r.pj}</span><span class="big">${r.pts}</span>`;
      const pos = mode === 'nivel' ? i + 1 : r.pos ?? '–';
      const sub = mode === 'puntos' && !r.pos ? `Nivel ${lvl(r.level)} · faltan ${r.missing} partido${r.missing === 1 ? '' : 's'}` : `Nivel ${lvl(r.level)}${tag}`;
      return `<a class="prow${me ? ' me' : ''}" href="#/jugador/${r.id}"><span class="pos">${pos}</span>${avatar(r, (r.pos && r.pos <= 3 && mode === 'puntos') ? 'top3' : '')}
        <span class="who"><b>${esc(r.full_name)}</b><span>${esc(sub)}</span></span>${right}</a>`;
    };
    let html = '';
    if (sv.phase === 'masters') html += `<a class="box navy row-between" href="#/masters" style="margin-top:14px;color:#fff"><span><b>Másters en juego</b><br><span style="font-size:13px;opacity:.8">Mira los cuadros y tu próximo partido</span></span>${I.trophy}</a>`;
    html += `<div class="search"><label class="sr" for="q">Buscar jugador</label>${I.search}<input id="q" class="input" placeholder="Buscar jugador" value="${esc(rankQuery)}" autocomplete="off"></div>`;
    if (rankTab === 'puntos') {
      const qual = d.qualified.filter(match), oth = d.others.filter(match);
      let lastZone = null;
      html += '<div class="list">';
      for (const r of qual) {
        if (r.zone !== lastZone) { lastZone = r.zone; html += `<div class="zone ${r.zone}"><span>${ZONES[r.zone][0]} · ${ZONES[r.zone][1]}</span><span>PJ · Pts</span></div>`; }
        html += row(r, 0, 'puntos');
      }
      if (oth.length) {
        html += `<div class="zone"><span>Aún sin clasificar · mínimo ${sv.min_matches} partidos</span><span>PJ · Pts</span></div>`;
        html += oth.map((r) => row(r, 0, 'puntos')).join('');
      }
      if (!qual.length && !oth.length) html += `<div class="empty">${q ? 'No hay nadie con ese nombre.' : 'Todavía no hay jugadores.'}</div>`;
      html += '</div>';
      if (!q && !qual.length && oth.length) html += `<p class="hint" style="margin:14px 6px">Los puestos de Máster aparecen cuando alguien juega ${sv.min_matches} partidos.</p>`;
    } else {
      const all = [...d.qualified, ...d.others].sort((a, b) => b.level - a.level).filter(match);
      html += `<div class="zone"><span>Por nivel</span><span>PJ · Nivel</span></div><div class="list">${all.map((r, i) => row(r, i, 'nivel')).join('') || '<div class="empty">No hay nadie con ese nombre.</div>'}</div>`;
    }
    document.getElementById('body').innerHTML = html;
    const qi = document.getElementById('q');
    qi.addEventListener('input', () => { rankQuery = qi.value; const pos = qi.selectionStart; paint(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  };
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { rankTab = b.dataset.t; paint(); } });
  paint();
}

/* ── Perfil de un jugador ──────────────────────────────────────────── */
async function screenPlayer(id) {
  const own = !id || isMe(id);
  render(`<main class="screen">${spinner()}</main>${nav(own ? 'perfil' : 'ranking')}`);
  let d;
  try { d = await api('GET', 'player/' + (own ? S.me.id : id)); } catch (e) { return errorScreen(e); }
  const p = d.player;
  S.season = d.season;
  const pill = p.pos ? `${p.pos}.º · ${p.pts} pts · ${ZONES[p.zone][0]}` : `${p.pts} pts · faltan ${p.missing} partido${p.missing === 1 ? '' : 's'}`;
  // nivel tras cada uno de los últimos partidos (del más antiguo al actual)
  const levels = [p.level];
  for (const m of d.recent) levels.unshift(levels[0] - m.delta);
  let cta = '';
  if (!own) {
    const v = d.vs;
    if (!v.canChallenge) cta = `<p class="hint" style="text-align:center;margin-top:18px">${S.season.phase === 'regular' ? 'Este jugador no está disponible.' : 'La fase regular ha terminado.'}</p>`;
    else if (v.bandBlock) cta = `<p class="hint" style="text-align:center;margin-top:18px">${esc(v.bandBlock)}</p>`;
    else if (v.openChallenge) cta = `<a class="btn block navy" style="margin-top:18px" href="#/retos">Ya tenéis un reto abierto · verlo</a>`;
    else if (v.pairLeft <= 0) cta = `<p class="hint" style="text-align:center;margin-top:18px">Ya habéis jugado los 2 partidos por pareja de esta temporada.</p>`;
    else cta = `<a class="btn block" style="margin-top:18px" href="#/retar/${p.id}">Retar a ${esc(first(p.full_name))}</a>`;
  }
  render(`<main class="screen">
    <div class="top">${own ? '<div style="width:44px"></div>' : backBtn('', 'Volver a la clasificación')}
      <div class="pill light">${esc(pill)}</div>
      ${own ? `<a class="icon-btn" href="#/ajustes" aria-label="Ajustes">${I.gear}</a>` : '<div style="width:44px"></div>'}</div>
    <div style="margin-top:14px">${cardHTML(p)}</div>
    <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
      <span class="pill light">${p.hand === 'zurdo' ? 'Zurdo' : 'Diestro'}</span>
      <span class="pill light">Revés a ${p.backhand === 'una' ? 'una mano' : 'dos manos'}</span>
      ${own ? `<span class="pill light">@${esc(p.username)}</span>` : ''}
    </div>
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><b>${p.matches_total}</b><span>Jugados</span></div>
      <div class="tile"><b style="color:var(--ok)">${p.won}</b><span>Ganados</span></div>
      <div class="tile"><b>${signed(p.level - p.start_level)}</b><span>Nivel desde el inicio</span></div>
    </div>
    ${cta}
    ${d.recent.length ? `<div class="sec"><span class="label">Últimos partidos</span>
      ${levels.length > 2 ? `<div class="box" style="padding:10px 12px;margin-bottom:8px">${spark(levels)}</div>` : ''}
      <div class="list">${d.recent.map((m) => `<a class="mrow" href="#/jugador/${m.rival_id}"><span class="wl${m.won ? '' : ' l'}">${m.won ? 'G' : 'P'}</span>
        <span class="r">vs ${esc(m.rival)}${m.master ? ' · Máster' : ''}${m.walkover ? ' · no jugado' : ''}</span>
        <span class="s">${esc(m.score)}</span><span class="badge ${m.delta >= 0 ? 'ok' : 'bad'}">${signed(m.delta)}</span></a>`).join('')}</div></div>`
      : `<p class="hint" style="text-align:center;margin-top:22px">${own ? 'Todavía no has jugado. Ve a la clasificación y reta a alguien.' : 'Todavía no ha jugado ningún partido.'}</p>`}
    ${own && S.me.is_admin ? `<a class="btn block ghost" style="margin-top:22px" href="#/admin">Panel del club</a>` : ''}
  </main>${nav(own ? 'perfil' : 'ranking')}`);
}

        <div style="background:rgba(255,255,255,.08);border-radius:12px;padding:9px 10px"><div class="label" style="color:rgba(255,255,255,.65);letter-spacing:.1em">Si pierdes</div><div style="font-size:15px;font-weight:700;margin-top:2px">${signed(v.stakes.loss)} nivel · +${v.stakes.ptsLoss} pt</div><div style="font-size:12px;opacity:.7;margin-top:2px">0-6 0-6: ${signed(v.stakes.lossBig)} · en 3 sets: +2 pts</div></div>

    <p class="hint" style="margin-top:12px">${esc(first(p.full_name))} tiene 7 días para responder y le llegará un email. La pista se reserva en el club. ${v.pairLeft === 1 ? 'Os queda 1 partido' : `Os quedan ${v.pairLeft} partidos`} entre vosotros esta temporada.</p>
    <div class="err hidden" id="e" style="margin-top:10px"></div>

/* ── Retos ─────────────────────────────────────────────────────────── */
async function screenRetos() {
  render(`<main class="screen"><div class="pagehead"><div><div class="label" style="color:var(--orange)">${esc(S.season?.name || 'Temporada 1')}</div><h1 class="h" style="margin-top:4px">Partidos</h1></div></div><div id="body">${spinner()}</div></main>${nav('retos')}`);
  let d;
  try { d = await api('GET', 'retos'); refreshMe().then(updateDot).catch(() => {}); } catch (e) { return errorScreen(e); }
  const C = d.challenges;
  const respond = C.filter((c) => c.myTurn);
  const confirm = C.filter((c) => c.match && c.match.status === 'pending' && !c.match.iReported);
  const report = C.filter((c) => c.canReport);
  const waitRes = C.filter((c) => c.match && (c.match.status === 'disputed' || (c.match.status === 'pending' && c.match.iReported)));
  const scheduled = C.filter((c) => c.status === 'accepted' && !c.canReport && !c.match);
  const waiting = C.filter((c) => c.status === 'pending' && !c.myTurn);
  const past = C.filter((c) => !['pending', 'accepted'].includes(c.status));
  const M = d.masters;
  const card = (c, inner) => `<div class="box"><div class="row-between"><a href="#/jugador/${c.rival.id}" style="display:flex;gap:10px;align-items:center;color:var(--ink);min-width:0">${avatar({ id: c.rival.id, full_name: c.rival.name, photo_v: c.rival.photo_v })}
      <span style="min-width:0"><b style="display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.rival.name)}</b><span class="when">${cap(fmtWhen(c.play_at))}</span></span></a></div>${inner}</div>`;
  let html = '';
  const sec = (title, items) => items ? `<div class="sec"><span class="label">${title}</span>${items}</div>` : '';
  html += sec('Te toca responder', respond.map((c) => card(c, `
    ${c.message ? `<p style="margin:10px 0 0;font-size:15px">«${esc(c.message)}»</p>` : ''}
    <p class="hint" style="margin-top:8px">${c.iAmChallenger ? `${esc(first(c.rival.name))} propone esta hora.` : `${esc(first(c.rival.name))} te ha retado.`}</p>
    <div class="btns"><button class="btn sm" data-act="accept" data-id="${c.id}">Acepto</button><a class="btn sm ghost" href="#/reto/${c.id}">Otra hora</a><button class="btn sm ghost" data-act="reject" data-id="${c.id}" data-ch="${c.iAmChallenger ? 1 : 0}">No puedo</button></div>`)).join(''));
  html += sec('Resultados por confirmar', [
    ...confirm.map((c) => card(c, resultBox(c.match, c.rival.name))),
    ...M.filter((n) => n.match && n.match.status === 'pending' && !n.match.iReported).map((n) => masterCard(n, resultBox(n.match, n.rival.name))),
  ].join(''));
  html += sec('Pon el resultado', [
    ...report.map((c) => card(c, `<div class="btns"><a class="btn sm" href="#/resultado/${c.id}">Poner resultado</a>${c.iAmChallenger ? `<button class="btn sm ghost" data-cancel="${c.id}">Cancelar</button>` : ''}</div>`)),
    ...M.filter((n) => !n.match).map((n) => masterCard(n, `<p class="hint" style="margin-top:8px">Quedad entre vosotros y reservad pista. Después, uno pone el resultado.</p><div class="btns"><a class="btn sm" href="#/master/${n.id}">Poner resultado</a></div>`)),
  ].join(''));
  html += sec('Esperando a tu rival', [
    ...waitRes.map((c) => card(c, `<p class="hint" style="margin-top:8px">${c.match.status === 'disputed' ? `Resultado en revisión por el club (${esc(c.match.score)}).` : `Has puesto ${c.match.iWon ? 'victoria' : 'derrota'} ${esc(c.match.score)}. Falta que lo confirme ${esc(first(c.rival.name))}.`}</p>
      ${c.match.status === 'pending' ? `<div class="btns"><button class="btn xs ghost" data-withdraw="${c.match.id}">Me he equivocado: borrar</button></div>` : ''}`)),
    ...M.filter((n) => n.match && (n.match.status === 'disputed' || n.match.iReported)).map((n) => masterCard(n, `<p class="hint" style="margin-top:8px">${n.match.status === 'disputed' ? 'Resultado en revisión por el club.' : `Has puesto ${esc(n.match.score)}. Falta que lo confirme tu rival.`}</p>`)),
    ...waiting.map((c) => card(c, `<p class="hint" style="margin-top:8px">Esperando respuesta de ${esc(first(c.rival.name))}.</p>${c.iAmChallenger ? `<div class="btns"><button class="btn xs ghost" data-cancel="${c.id}">Cancelar reto</button></div>` : ''}`)),
  ].join(''));
  html += sec('Partidos programados', scheduled.map((c) => card(c, `<p class="hint" style="margin-top:8px">Reservad pista en el club. Después del partido, uno pone el resultado aquí.</p>${c.iAmChallenger ? `<div class="btns"><button class="btn xs ghost" data-cancel="${c.id}">Cancelar</button></div>` : ''}`)).join(''));
  html += sec('Últimos días', past.map((c) => `<div class="mrow" style="margin-top:6px"><span class="r">${esc(c.rival.name)} · ${fmtWhen(c.play_at.slice(0, 10), false)}</span><span class="badge ${c.status === 'done' ? 'ok' : ''}">${
    { done: c.walkover ? 'No jugado (6-0 6-0)' : 'Jugado', rejected: 'Rechazado', expired: 'Caducado', cancelled: 'Cancelado' }[c.status] || c.status}</span></div>`).join(''));
  if (!html) html = `<div class="empty">No tienes retos abiertos.<br>Ve a la clasificación, entra en un jugador y rétale.<div style="margin-top:18px"><a class="btn sm" href="#/">Ver la clasificación</a></div></div>`;
  html += `<p class="hint" style="margin:22px 6px 0">Rechazos libres que te quedan este mes: <b>${d.rejectsLeft}</b> de 2. A partir del tercero, el partido cuenta como derrota 6-0 6-0.</p>`;
  document.getElementById('body').innerHTML = html;
  const body = document.getElementById('body');
  body.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.act === 'accept') {
        await busy(b, () => api('POST', `challenge/${b.dataset.id}/respond`, { action: 'accept' }));
        toast('¡Partido aceptado! Reservad pista en el club.', true); screenRetos();
      } else if (b.dataset.act === 'reject') {
        let text = 'Avisaremos a tu rival por email.';
        if (b.dataset.ch === '0') {
          const info = await api('GET', `challenge/${b.dataset.id}`);
          text = info.challenge.rejectIsWalkover ? '<b>Ojo:</b> ya has usado tus 2 rechazos libres de este mes. Si rechazas, el partido cuenta como <b>derrota 6-0 6-0</b>. ¿Mejor proponer otra hora?'
            : `Te quedan ${info.challenge.rejectsLeft} rechazos libres este mes. Si lo que pasa es la hora, mejor propón otra.`;
        }
        if (!(await confirmBox('¿No puedes jugar?', text, 'No puedo'))) return;
        const r = await api('POST', `challenge/${b.dataset.id}/respond`, { action: 'reject' });
        toast(r.status === 'walkover' ? 'Rechazado: cuenta como derrota 6-0 6-0.' : 'Hecho. Hemos avisado a tu rival.'); screenRetos();
      } else if (b.dataset.cancel) {
        if (!(await confirmBox('¿Cancelar el reto?', 'Avisaremos a tu rival.', 'Cancelar reto', true))) return;
        await api('POST', `challenge/${b.dataset.cancel}/cancel`); toast('Reto cancelado.'); screenRetos();
      } else if (b.dataset.withdraw) {
        await api('POST', `match/${b.dataset.withdraw}/withdraw`); toast('Resultado borrado. Ponlo otra vez.'); screenRetos();
      } else if (b.dataset.confirm) {
        await busy(b, () => api('POST', `match/${b.dataset.confirm}/confirm`));
        toast('Resultado confirmado. Clasificación actualizada.', true); screenRetos();
      } else if (b.dataset.dispute) {
        const note = await sheet(`<h2>¿No estás de acuerdo?</h2><p>El club revisará el resultado y os dirá algo. Si quieres, explica qué pasó.</p>
          <textarea class="input" id="note" rows="3" maxlength="300" style="margin-top:14px" placeholder="Por ejemplo: el segundo set fue 7-5 para mí"></textarea>
          <div class="btns" style="margin-top:16px"><button class="btn ghost" data-close="no">Volver</button><button class="btn navy" id="send">Avisar al club</button></div>`,
          (el, close) => el.querySelector('#send').addEventListener('click', () => close(el.querySelector('#note').value || ' ')));
        if (note === null) return;
        await api('POST', `match/${b.dataset.dispute}/dispute`, { note }); toast('Avisado. El club lo revisará.'); screenRetos();
      }
    } catch (err) { toast(err.message); }
  });
}
function resultBox(m, rival) {
  return `<div class="box" style="margin-top:10px;background:var(--soft);border:0"><div style="font-size:13px;color:var(--muted);font-weight:600">${esc(first(rival))} ha puesto:</div>
    <div style="font-size:20px;font-weight:700;margin-top:2px">${m.iWon ? 'Ganas' : 'Pierdes'} ${esc(m.score)}</div></div>
    <div class="btns"><button class="btn sm" data-confirm="${m.id}">Confirmar</button><button class="btn sm ghost" data-dispute="${m.id}">No estoy de acuerdo</button></div>`;
}
function masterCard(n, inner) {
  return `<div class="box"><div class="kind" style="color:#A47F2A">${ZONES[n.tier][0]} · ${esc(n.round)}</div>
    <a href="#/jugador/${n.rival.id}" style="display:block;margin-top:6px;font-size:16px;font-weight:700;color:var(--ink)">vs ${esc(n.rival.name)}</a>${inner}</div>`;
}
function updateDot() {
  const nav = document.querySelector('.nav a[href="#/retos"]'); if (!nav) return;
  nav.querySelector('.dot')?.remove();
  if (S.todo > 0) nav.insertAdjacentHTML('beforeend', `<span class="dot">${S.todo}</span>`);
}

/* ── Contrapropuesta de hora ───────────────────────────────────────── */
async function screenCounter(id) {
  render(`<main class="screen nonav">${spinner()}</main>`);
  let d;
  try { d = await api('GET', 'challenge/' + id); } catch (e) { return errorScreen(e, 'retos'); }
  const c = d.challenge;
  if (!c.myTurn) { toast(c.status === 'pending' ? 'Te toca esperar a tu rival.' : 'Este reto ya está respondido.'); return go('retos'); }
  render(`<main class="screen nonav">
    <div class="top">${backBtn('retos')}<div class="title">Proponer otra hora</div><div style="width:44px"></div></div>
    <div class="box" style="margin-top:18px"><div class="label">Propuesta de ${esc(first(c.rival.name))}</div><div style="font-size:18px;font-weight:700;margin-top:4px">${cap(fmtWhen(c.play_at))}</div>
      ${c.message ? `<p style="margin:8px 0 0">«${esc(c.message)}»</p>` : ''}</div>
    ${c.countersLeft > 0 ? `${whenPicker('w')}
      <p class="hint" style="margin-top:12px">${esc(first(c.rival.name))} recibirá un email con tu propuesta. Podéis cambiar la hora ${c.countersLeft} ${c.countersLeft === 1 ? 'vez' : 'veces'} más.</p>
      <div class="err hidden" id="e" style="margin-top:10px"></div>
      <button class="btn block" id="send" style="margin-top:16px">Proponer esta hora</button>`
      : '<p class="hint" style="margin-top:16px">Ya habéis cambiado la hora 3 veces. Habladlo directamente y, si hace falta, que uno cree un reto nuevo.</p>'}
    <div class="btns" style="margin-top:12px"><button class="btn sm ghost" id="acc">Mejor acepto la suya</button></div>
  </main>`);
  document.getElementById('acc').addEventListener('click', async (e) => {
    try { await busy(e.currentTarget, () => api('POST', `challenge/${c.id}/respond`, { action: 'accept' })); toast('¡Partido aceptado!', true); go('retos'); } catch (err) { toast(err.message); }
  });
  if (c.countersLeft > 0) {
    const get = bindWhen(document.getElementById('w'));
    const btn = document.getElementById('send');
    btn.addEventListener('click', () => busy(btn, async () => {
      try { const w = get(); await api('POST', `challenge/${c.id}/respond`, { action: 'counter', date: w.date, time: w.time }); toast('Propuesta enviada.', true); go('retos'); }
      catch (err) { setErr(document.getElementById('e'), err.message); }
    }));
  }
}

/* ── Poner resultado ───────────────────────────────────────────────── */
async function screenResult(kind, id) {
  render(`<main class="screen nonav">${spinner()}</main>`);
  let rival, title;
  try {
    const d = await api('GET', 'retos');
    if (kind === 'c') { const c = d.challenges.find((x) => x.id === Number(id)); if (!c || !c.canReport) throw new Error('Este partido no está pendiente de resultado.'); rival = c.rival; title = cap(fmtWhen(c.play_at)); }
    else { const n = d.masters.find((x) => x.id === Number(id)); if (!n || n.match) throw new Error('Este partido no está pendiente de resultado.'); rival = n.rival; title = `${ZONES[n.tier][0]} · ${n.round}`; }
  } catch (e) { return errorScreen(e, 'retos'); }
  render(`<main class="screen nonav">
    <div class="top">${backBtn('retos')}<div class="title">Resultado</div><div style="width:44px"></div></div>
    <h1 class="h" style="font-size:26px">Tú vs ${esc(first(rival.name))}</h1><p class="sub">${esc(title)}</p>
    <div class="box" style="margin-top:18px">
      <div class="setrow" style="margin-bottom:6px"><span></span><span class="label" style="text-align:center">Tú</span><span></span><span class="label" style="text-align:center">${esc(first(rival.name))}</span></div>
      ${[1, 2, 3].map((n) => `<div class="setrow" style="margin-top:8px"><span class="label" style="text-align:left">${n === 3 ? '3.er set' : n + '.º set'}</span>
        <input class="input" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-s="${n - 1}" data-i="0" aria-label="Tus juegos, set ${n}">
        <span>–</span><input class="input" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-s="${n - 1}" data-i="1" aria-label="Juegos del rival, set ${n}"></div>`).join('')}
    </div>
    <p class="hint" style="margin-top:10px">Si el tercer set fue un súper tie-break, pon los puntos (por ejemplo 10-7). Deja vacío lo que no se jugó.</p>
    <div id="preview" style="margin-top:14px;text-align:center;font-size:18px;font-weight:700;min-height:24px"></div>
    <div class="err hidden" id="e" style="margin-top:10px"></div>
    <button class="btn block" id="send" style="margin-top:16px">Enviar resultado</button>
    <p class="hint" style="margin-top:10px;text-align:center">${esc(first(rival.name))} tiene que confirmarlo. Si no responde en 48 h, se da por bueno.</p>
  </main>`);
  const sets = () => [0, 1, 2].map((s) => [0, 1].map((i) => document.querySelector(`[data-s="${s}"][data-i="${i}"]`).value.trim()))
    .filter((x) => x[0] !== '' || x[1] !== '').map((x) => x.map(Number));
  const preview = () => {
    const s = sets(); let w = 0, l = 0;
    s.forEach(([a, b]) => { if (a > b) w++; else if (b > a) l++; });
    document.getElementById('preview').textContent = s.length && w !== l ? `${w > l ? 'Ganas' : 'Pierdes'} ${s.map((x) => x.join('-')).join(' ')}` : '';
  };
  document.querySelectorAll('.setrow .input').forEach((inp, i, all) => inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, ''); preview();
    // salta a la siguiente casilla; con un «1» espera por si es un 10 (súper tie-break)
    if (all[i + 1] && inp.value && (inp.value.length === 2 || Number(inp.value) >= 2)) all[i + 1].focus();
  }));
  const btn = document.getElementById('send');
  btn.addEventListener('click', () => busy(btn, async () => {
    try {
      const path = kind === 'c' ? `challenge/${id}/result` : `masters/${id}/result`;
      await api('POST', path, { sets: sets() });
      toast(`Enviado. Falta que ${first(rival.name)} lo confirme.`, true); go('retos');
    } catch (err) { setErr(document.getElementById('e'), err.message); }
  }));
}

function paintFeed() {
  const body = document.getElementById('body'); if (!body) return;
  body.innerHTML = (feedPosts.length ? `<div style="margin-top:12px">${feedPosts.map(postHTML).join('')}</div>` : '<div class="empty">Todavía no hay nada. ¡Lanza el primer reto!</div>')
    + (feedMore ? '<div style="text-align:center;margin-top:14px"><button class="btn sm ghost" id="more">Ver más</button></div>' : '');
  body.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'more') return screenFeed(true);
    if (b.dataset.open) { openComments.add(Number(b.dataset.open)); paintFeed(); document.getElementById('c' + b.dataset.open)?.focus(); return; }
    if (b.dataset.close) { openComments.delete(Number(b.dataset.close)); paintFeed(); return; }
    try {
      if (b.dataset.like) {
        const post = feedPosts.find((x) => x.id === Number(b.dataset.like));
        post.liked = !post.liked; post.likes = (post.likes || 0) + (post.liked ? 1 : -1); paintFeed();
        const r = await api('POST', `feed/${post.id}/like`);
        post.liked = r.liked; post.likes = r.likes; paintFeed();
        return;
      }
      if (b.dataset.likers) {
        const r = await api('GET', `feed/${b.dataset.likers}/likes`);
        await sheet(`<h2>Me gusta</h2><div class="list" style="margin-top:14px">${r.players.map((pl) => `<a class="prow" href="#/jugador/${pl.id}" data-close="no">${avatar(pl)}<span class="who"><b>${esc(pl.full_name)}</b></span></a>`).join('')}</div>
          <div class="btns" style="margin-top:16px"><button class="btn ghost" data-close="no">Cerrar</button></div>`);
        return;
      }
      if (b.dataset.delc) { if (!(await confirmBox('¿Borrar el comentario?', '', 'Borrar', true))) return; await api('POST', `comment/${b.dataset.delc}/delete`); }
      if (b.dataset.delp) { if (!(await confirmBox('¿Borrar esta publicación?', 'Se borra para todos, con sus comentarios.', 'Borrar', true))) return; await api('POST', `admin/feed/${b.dataset.delp}/delete`); }
      const keep = new Set(openComments); await screenFeed(); openComments = keep; paintFeed();
    } catch (err) { toast(err.message); }
  };
  body.onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target.closest('.cform'); if (!f) return;
    const inp = f.querySelector('input'); if (!inp.value.trim()) return;
    try { await busy(f.querySelector('button'), () => api('POST', `feed/${f.dataset.post}/comment`, { body: inp.value })); const keep = new Set(openComments); await screenFeed(); openComments = keep; paintFeed(); }
    catch (err) { toast(err.message); }
  };
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const S2 = 320, c = document.createElement('canvas'); c.width = S2; c.height = S2;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S2, S2);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('No se ha podido leer esa imagen.'));
    img.src = URL.createObjectURL(file);
  });
}
